# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# bos-universal-action-test.yml — reusable Action pytest matrix + live
# smoke test
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Purpose
# -------
# Reusable test surface for GitHub Actions repositories (composite or
# Docker-backed) that ship a Python implementation:
#
#   1. pytest      — runs the repo's test suite across a configurable
#                    Python/OS matrix.
#   2. smoke-test  — optionally exercises the action itself (`uses:
#                    ./`) against a live upstream target, verifying it
#                    produces the expected outputs. Gated behind
#                    `enable_smoke_test` and `smoke_trigger` so PRs
#                    from forks or untrusted branches don't hit live
#                    upstream services by default.
#
# This complements, and does not replace, `bos-universal-security.yml`'s
# `python-lint` job (Ruff + single-OS/Python pytest as part of the PR
# security gate). Use this workflow when a Marketplace Action needs
# broader matrix coverage and/or a live-upstream validation pass,
# typically on push to the default branch rather than on every PR.
#
# How to call from another repo
# ------------------------------
#   jobs:
#     action-test:
#       uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-action-test.yml@main
#
#   Then set `action_test` in the caller's own
#   `.github/bos-universal-config.json`, e.g.:
#     { "action_test": {
#         "enable_smoke_test": true,
#         "smoke_test_config": {"source": "npm", "package_name": "@actions/core"}
#     } }
#   Every field not set there falls back to this hub's org-wide
#   defaults, then to pyproject.toml-based auto-detection, then to a
#   hardcoded default — see "Configuration" below.
#
# Pin discipline
# --------------
# Third-party action references are pinned to a 40-char SHA per hub
# policy (gate #5 in `bos-universal-security.yml`); Dependabot keeps
# them current.
#
# Configuration
# -------------
# Every job reads `action_test` from the caller's own
# `.github/bos-universal-config.json` via the shared `universal-config`
# composite, layered over this hub's org-wide
# `sync-files/config/action-test-global-config.json` (repo config always
# wins). Any field left unset in both tiers is auto-detected from the
# caller's `pyproject.toml` (`requires-python` floor → a Python version
# matrix; a `dev` extra → `pip install -e .[dev]`) before falling back to
# a hardcoded default. There are no `workflow_call` inputs — configure
# this workflow the same way as every other hub-managed kicker, through
# `action_test` in `.github/bos-universal-config.json`, not `with:`.

name: '[RUNTIME] Blackout Secure Universal Action Test'

on:
  workflow_call:

permissions: {}

concurrency:
  group: bos-action-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-config:
    name: Resolve universal config
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      test: ${{ steps.config.outputs.action_test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout hub org-wide action_test defaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackoutsecure/bos-automation-hub
          ref: main
          path: hub-config
          sparse-checkout: sync-files/config/action-test-global-config.json
          sparse-checkout-cone-mode: false
      - name: Load universal config
        id: config
        uses: blackoutsecure/bos-automation-hub/.github/actions/universal-config@main
        with:
          config_path: .github/bos-universal-config.json
          allow_missing: 'false'
          global_config_path: hub-config/sync-files/config/action-test-global-config.json
          use_global_config: auto

  pytest:
    name: pytest (py${{ matrix.python-version }} / ${{ matrix.os }})
    needs: resolve-config
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ fromJSON(needs.resolve-config.outputs.test).timeout_pytest }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.resolve-config.outputs.test).python_versions }}
        os: ${{ fromJSON(needs.resolve-config.outputs.test).os_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        shell: bash
        env:
          ACTION_TEST: ${{ needs.resolve-config.outputs.test }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          test_cfg = json.loads(os.environ["ACTION_TEST"])
          packages = test_cfg.get("python_packages", [])
          if not isinstance(packages, list) or not packages:
              raise SystemExit("action_test.python_packages must be a non-empty array")
          normalized = []
          for package in packages:
              if not isinstance(package, str) or not package.strip():
                  raise SystemExit("action_test.python_packages entries must be non-empty strings")
              normalized.append(package.strip())
          subprocess.check_call([sys.executable, "-m", "pip", "install", *normalized])
          PY

      - name: Run pytest
        id: pytest
        shell: bash
        run: pytest ${{ fromJSON(needs.resolve-config.outputs.test).pytest_args }} 2>&1 | tee "${RUNNER_TEMP}/pytest-output.txt"

      - name: Upload failure log
        if: failure() && steps.pytest.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-failure-py${{ matrix.python-version }}-${{ matrix.os }}
          path: ${{ runner.temp }}/pytest-output.txt
          retention-days: 5

  # -----------------------------------------------------------------
  # Smoke test — validates the action against a live upstream target.
  # Runs only when explicitly enabled, and only on the trigger the
  # caller opted into, since it can reach out to third-party services
  # and should not run unattended on untrusted PR heads.
  #
  # Not fully generic: GitHub Actions can't dynamically build a `with:`
  # block from arbitrary JSON, so the inputs passed to the action under
  # test are a fixed set (`source` / `package_name`) matching
  # `bos-upstream-watcher`'s shape today. A repo whose action takes a
  # different shape of inputs should leave `enable_smoke_test` off and
  # rely on its own repo-specific test suite via `pytest` above instead
  # — `smoke_test_output_name` only lets the *output* being asserted on
  # vary, not the inputs supplied.
  # -----------------------------------------------------------------
  smoke-test:
    name: smoke test (live upstream)
    needs: [resolve-config, pytest]
    if: |
      fromJSON(needs.resolve-config.outputs.test).enable_smoke_test == true &&
      (
        fromJSON(needs.resolve-config.outputs.test).smoke_trigger == 'always' ||
        (fromJSON(needs.resolve-config.outputs.test).smoke_trigger == 'push-dev' && github.event_name == 'push' && github.ref == 'refs/heads/dev')
      )
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.resolve-config.outputs.test).timeout_smoke }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: action-under-test
        uses: ./
        with:
          source: ${{ fromJSON(needs.resolve-config.outputs.test).smoke_test_config.source || '' }}
          package_name: ${{ fromJSON(needs.resolve-config.outputs.test).smoke_test_config.package_name || '' }}

      - name: Verify action outputs
        shell: bash
        env:
          SMOKE_OUTPUT_NAME: ${{ fromJSON(needs.resolve-config.outputs.test).smoke_test_output_name }}
          SMOKE_OUTPUT_VALUE: ${{ steps.action-under-test.outputs[fromJSON(needs.resolve-config.outputs.test).smoke_test_output_name] }}
        run: |
          set -euo pipefail
          if [[ -z "${SMOKE_OUTPUT_VALUE}" ]]; then
            echo "::error::action under test did not produce a non-empty '${SMOKE_OUTPUT_NAME}' output"
            exit 1
          fi
          echo "action ${SMOKE_OUTPUT_NAME} output: ${SMOKE_OUTPUT_VALUE}"

  # -----------------------------------------------------------------
  # Failure summary — opt-in (`enable_ai_failure_summary`, on by
  # default). Runs only when the pytest matrix actually failed;
  # downloads each failed cell's captured output and asks GitHub
  # Models for a one-paragraph root-cause hypothesis. Same
  # opportunistic-fallback contract as every other AI feature in this
  # org: a missing `models: read` grant, disabled provider, or failed
  # request silently falls back to a deterministic listing of which
  # matrix cells failed, never blocks the workflow.
  # -----------------------------------------------------------------
  failure-summary:
    name: Failure summary
    needs: [resolve-config, pytest]
    if: failure() && fromJSON(needs.resolve-config.outputs.test).enable_ai_failure_summary == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      models: read
    steps:
      - name: Download failed pytest logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: pytest-failure-*
          path: failures
          merge-multiple: false

      - name: Summarize matrix failures
        shell: bash
        env:
          AI_ENABLED: ${{ fromJSON(needs.resolve-config.outputs.test).enable_ai_failure_summary }}
          AI_MODEL: ${{ fromJSON(needs.resolve-config.outputs.test).ai_model }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAILED_CELLS=$(find failures -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sed 's#failures/pytest-failure-##' | sort || true)
          {
            echo "## Action test failure summary"
            echo
            if [[ -z "${FAILED_CELLS}" ]]; then
              echo "pytest matrix failed, but no per-cell failure log was captured."
            else
              echo "Failed matrix cells:"
              echo
              while IFS= read -r cell; do
                [[ -n "${cell}" ]] && echo "- \`${cell}\`"
              done <<< "${FAILED_CELLS}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          [[ -z "${FAILED_CELLS}" ]] && exit 0

          if [[ -z "${AI_MODEL}" || "${AI_MODEL}" == "auto" ]]; then
            AI_MODEL="${GITHUB_MODELS_MODEL_ACTION_TEST:-${GITHUB_MODELS_MODEL:-openai/gpt-4o-mini}}"
          fi

          PROMPT_FILE="${RUNNER_TEMP}/failure-summary.prompt.txt"
          {
            echo "The following GitHub Actions pytest matrix cells failed. For each,"
            echo "the tail of its captured output follows. In 2-3 sentences, give a"
            echo "root-cause hypothesis a maintainer can start triaging from. Output"
            echo "plain text only, no markdown headers."
            echo
            while IFS= read -r cell; do
              [[ -z "${cell}" ]] && continue
              echo "### ${cell}"
              tail -c 2000 "failures/pytest-failure-${cell}/pytest-output.txt" 2>/dev/null || echo "(no log captured)"
              echo
            done <<< "${FAILED_CELLS}"
          } > "${PROMPT_FILE}"

          if [[ "${AI_ENABLED}" != "true" ]]; then
            exit 0
          fi

          AI_OUT="${RUNNER_TEMP}/failure-summary.ai.txt"
          PAYLOAD=$(jq -Rs --arg model "${AI_MODEL}" '{
            model: $model,
            temperature: 0.1,
            messages: [
              {"role": "system", "content": "You are a precise CI triage assistant. Output plain text only."},
              {"role": "user",   "content": . }
            ]
          }' < "${PROMPT_FILE}")

          HTTP_CODE=$(curl -sS \
            -o "${AI_OUT}" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "${PAYLOAD}" \
            'https://models.github.ai/inference/chat/completions' \
            2>/dev/null || true)

          if [[ "${HTTP_CODE}" == "200" ]]; then
            AI_CONTENT=$(jq -r '.choices[0].message.content // empty' "${AI_OUT}" 2>/dev/null || true)
            if [[ -n "${AI_CONTENT}" ]]; then
              {
                echo
                echo "**AI hypothesis** (${AI_MODEL}):"
                echo
                echo "${AI_CONTENT}"
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi
          echo "::notice::failure-summary: AI request unavailable (HTTP ${HTTP_CODE:-none}); deterministic listing above stands alone."

