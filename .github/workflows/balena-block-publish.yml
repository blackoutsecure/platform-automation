name: Balena Block Publish

"on":
  workflow_call:
    inputs:
      block_name:
        description: "Balena block slug (without namespace)."
        required: true
        type: string
      balena_namespace:
        description: "Balena namespace (user/org) that owns the block."
        required: true
        type: string
      source:
        description: "Path passed as `source` to deploy-to-balena-action."
        required: false
        type: string
        default: .
      balena_yml_path:
        description: "Path to balena.yml (used for version sync)."
        required: false
        type: string
        default: ./balena.yml
      publish:
        description: "'true'/'false' to force; empty => publish only on push to default branch."
        required: false
        type: string
        default: ""
      version:
        description: "Explicit version. Overrides auto-resolved when set."
        required: false
        type: string
        default: ""
      auto_resolve_version:
        description: "Run `resolve-docker-image-tags` to derive the version."
        required: false
        type: boolean
        default: true
      version_source:
        description: "`auto` | `dockerfile` | `file` | `git_tag` | `sha`."
        required: false
        type: string
        default: auto
      dockerfile:
        description: "Path to the Dockerfile (used by version resolver)."
        required: false
        type: string
        default: ./Dockerfile
      version_build_arg:
        description: "Dockerfile ARG name to read the version from."
        required: false
        type: string
        default: APP_VERSION
      version_file:
        description: "Plain-text version file path (used by `file`/`auto`)."
        required: false
        type: string
        default: VERSION
      sync_balena_yml:
        description: >-
          When publishing on the default branch, rewrite the top-level
          `version:` in balena.yml and commit it back. Requires
          `contents: write` on the caller. Ignored (no-op) when
          `generate_balena_yml: true` — the manifest is rendered fresh
          on each run, so commit-back is pointless.
        required: false
        type: boolean
        default: true
      generate_balena_yml:
        description: >-
          Render `balena.yml` dynamically from the `block_*` inputs and
          write it to `balena_yml_path` after checkout. Lets consumer
          repos keep `balena.yml` out of their source tree entirely.
          When `true`, the `sync-balena-yml` commit-back job is skipped
          unconditionally.
        required: false
        type: boolean
        default: false
      block_type:
        description: >-
          Top-level `type:` written to the rendered `balena.yml`
          (e.g. `sw.block`, `sw.application`). Used only when
          `generate_balena_yml: true`.
        required: false
        type: string
        default: sw.block
      block_description:
        description: >-
          Rendered `description:` field. Optional — omitted from the
          generated `balena.yml` when empty. Used only when
          `generate_balena_yml: true`.
        required: false
        type: string
        default: ""
      block_post_provisioning:
        description: >-
          Rendered `post-provisioning:` Markdown. Multi-line; pass as a
          YAML literal block (`|`). Optional — omitted when empty. Used
          only when `generate_balena_yml: true`.
        required: false
        type: string
        default: ""
      block_assets_repository_url:
        description: >-
          `assets.repository.data.url` for the rendered manifest. When
          empty, defaults to `${github.server_url}/${github.repository}`
          of the **caller** repo. Must be `https://` when set. Used only
          when `generate_balena_yml: true`.
        required: false
        type: string
        default: ""
      block_assets_logo_url:
        description: >-
          Optional `assets.logo.data.url` for the rendered manifest.
          Must be `https://` when set; empty omits the logo entry. Used
          only when `generate_balena_yml: true`.
        required: false
        type: string
        default: ""
      block_default_device_type:
        description: >-
          `data.defaultDeviceType` slug for the rendered manifest.
          Optional — when empty, the renderer uses the first entry of
          the resolved `supportedDeviceTypes` list (see
          `block_supported_device_types` / `block_architectures` /
          `block_platforms` / `block_image_ref`). Validated to appear in
          the resolved list either way. Used only when
          `generate_balena_yml: true`.
        required: false
        type: string
        default: ""
      block_supported_device_types:
        description: >-
          Explicit `data.supportedDeviceTypes` list. Accepts newline-
          and/or comma-separated balena device-type slugs. Optional —
          when empty, the renderer derives the list from (in waterfall
          order) `block_image_ref` (live docker manifest sniff),
          `block_architectures` (balena arch slugs), or `block_platforms`
          (docker buildx `os/arch[/variant]` list). At least one of the
          four must resolve. Used only when `generate_balena_yml: true`.
        required: false
        type: string
        default: ""
      block_architectures:
        description: >-
          Newline- and/or comma-separated balena arch slugs (`aarch64`,
          `amd64`, `armv7hf`, `rpi`, `i386`) expanded into a curated
          per-arch device-type list when `block_supported_device_types`
          is empty and `block_image_ref` did not resolve. Used only when
          `generate_balena_yml: true`.
        required: false
        type: string
        default: ""
      block_platforms:
        description: >-
          Comma-separated docker buildx platform list, e.g.
          `linux/amd64,linux/arm64`. Each entry is mapped to a balena
          arch and expanded via the curated device-type map. Used only
          when `block_supported_device_types`, `block_image_ref`, and
          `block_architectures` are all empty / unresolved. Used only
          when `generate_balena_yml: true`.
        required: false
        type: string
        default: ""
      block_image_ref:
        description: >-
          Optional fully-qualified docker image reference
          (`[registry/]namespace/name:tag`). When set and
          `block_supported_device_types` is empty, the renderer runs
          `docker buildx imagetools inspect` against the ref and uses
          the published platform list as the source of truth. Silent
          fallthrough to `block_architectures` / `block_platforms` on
          sniff failure. Used only when `generate_balena_yml: true`.
        required: false
        type: string
        default: ""
      draft:
        description: "Publish as a draft (sets `finalize: false`)."
        required: false
        type: boolean
        default: false
      force:
        description: >-
          Force a fresh release even when `deploy-to-balena-action`
          finds an existing release matching the source revision.
          Sets `cache: false` on the action; balena will rebuild from
          cached layers (so `layer_cache` is intentionally left alone
          — a force-republish of an unchanged tree should still be
          fast) and create a brand-new release record.
        required: false
        type: boolean
        default: false
      cache:
        description: "Forwarded to deploy-to-balena-action `cache`."
        required: false
        type: boolean
        default: true
      layer_cache:
        description: "Forwarded to deploy-to-balena-action `layer_cache`."
        required: false
        type: boolean
        default: true
      debug:
        description: "Forwarded to deploy-to-balena-action `debug`."
        required: false
        type: boolean
        default: false
      runs_on:
        description: >-
          Optional runner override for the publish job. When empty (the
          default), resolves from the org-shared `vars.DEFAULT_RUNNER`.
          The shared publisher installs the native balena CLI on x64 or
          ARM64 runners. Accepts either a bare label (e.g. `ubuntu-latest`)
          or a JSON-array string of labels (e.g. `["self-hosted","Linux","X64"]`);
          both shapes are parsed at runtime via `fromJSON` so GHA sees
          a real label list rather than a single literal string. No silent
          fallback: `vars.DEFAULT_RUNNER` is validated by the
          `preflight-runner-config` job (see README.md "Runner
          configuration") so a job that reaches this stage is
          guaranteed to evaluate against a valid label set.
        required: false
        type: string
        default: ""
    secrets:
      BALENA_API_TOKEN:
        required: true
    outputs:
      published:
        description: "`true` when a release was actually pushed to balenaCloud."
        value: ${{ jobs.setup.outputs.publish }}
      version:
        description: "Resolved block version."
        value: ${{ jobs.setup.outputs.version }}
      fleet:
        description: "Resolved `<namespace>/<block_name>` slug."
        value: ${{ jobs.setup.outputs.fleet }}
      release_id:
        description: "Balena release id (when publish ran)."
        value: ${{ jobs.publish.outputs.release_id }}

permissions:
  contents: read

concurrency:
  # balenaCloud rejects concurrent pushes to the same block.
  group: balena-block-${{ github.workflow }}-${{ inputs.block_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Preflight — validate `vars.DEFAULT_RUNNER` for setup, synchronization,
  # and publishing. The shared publisher supports x64 and ARM64.
  # ---------------------------------------------------------------------------
  preflight-runner-config:
    name: Preflight (runner config)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: blackoutsecure/bos-automation-hub/.github/actions/shared/preflight-runner-config@main
        with:
          # Forward all three runner vars so the log shows the full
          # org-var state, not just the ones this workflow enforces.
          # The `require_*` flags determine which must be set.
          default_runner: ${{ vars.DEFAULT_RUNNER }}
          runner_x64: ${{ vars.RUNNER_X64 }}
          runner_arm64: ${{ vars.RUNNER_ARM64 }}

  setup:
    name: Setup
    needs: preflight-runner-config
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see README.md ("Runner
    # configuration") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      version: ${{ steps.resolve.outputs.version }}
      fleet: ${{ steps.resolve.outputs.fleet }}
      build_date: ${{ steps.resolve.outputs.build_date }}
    steps:
      - name: Preflight validation
        env:
          BLOCK_NAME: ${{ inputs.block_name }}
          BALENA_NAMESPACE: ${{ inputs.balena_namespace }}
          VERSION_SOURCE: ${{ inputs.version_source }}
          VERSION: ${{ inputs.version }}
          BALENA_API_TOKEN: ${{ secrets.BALENA_API_TOKEN }}
        run: |
          set -euo pipefail
          ERR=0
          fail() { echo "ERROR: $*" >&2; ERR=1; }

          # A stray newline in a secret silently truncates GITHUB_OUTPUT
          # for any downstream job, so reject it explicitly.
          check_singleline() {
            local name="$1" val="$2"
            [ -n "${val}" ] || { fail "${name} is missing"; return; }
            case "${val}" in
              *[$'\n\r\t ']*) fail "${name} contains whitespace/newlines" ;;
            esac
          }

          SLUG_RE='^[a-z0-9]+([._-][a-z0-9]+)*$'
          check_slug() {
            local name="$1" val="$2"
            [ -n "${val}" ] || { fail "${name} is empty"; return; }
            printf '%s' "${val}" | grep -Eq "${SLUG_RE}" \
              || fail "${name} is not a valid Balena slug: '${val}'"
          }

          check_singleline "input 'block_name'"        "${BLOCK_NAME}"
          check_singleline "input 'balena_namespace'"  "${BALENA_NAMESPACE}"
          check_singleline "secret 'BALENA_API_TOKEN'" "${BALENA_API_TOKEN}"
          check_slug       "input 'block_name'"        "${BLOCK_NAME}"
          check_slug       "input 'balena_namespace'"  "${BALENA_NAMESPACE}"

          case "${VERSION_SOURCE}" in
            auto|dockerfile|file|git_tag|sha) ;;
            *) fail "input 'version_source' must be one of: auto|dockerfile|file|git_tag|sha (got '${VERSION_SOURCE}')" ;;
          esac

          if [ -n "${VERSION}" ]; then
            check_singleline "input 'version'" "${VERSION}"
          fi

          [ "${ERR}" -eq 0 ] || { echo "Preflight validation failed." >&2; exit 1; }
          echo "Preflight OK."

      - name: Checkout caller repo
        if: inputs.auto_resolve_version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: tags
        if: inputs.auto_resolve_version
        uses: blackoutsecure/bos-automation-hub/.github/actions/resolve-docker-image-tags@main
        with:
          version_override: ${{ inputs.version }}
          version_source: ${{ inputs.version_source }}
          dockerfile: ${{ inputs.dockerfile }}
          dockerfile_arg: ${{ inputs.version_build_arg }}
          version_file: ${{ inputs.version_file }}

      - name: Resolve release context
        id: ctx
        uses: blackoutsecure/bos-automation-hub/.github/actions/resolve-release-context@main
        with:
          publish_override: ${{ inputs.publish }}
          auto_resolve_version: ${{ inputs.auto_resolve_version }}
          resolved_version: ${{ steps.tags.outputs.version }}
          resolved_build_date: ${{ steps.tags.outputs.build_date }}
          version_override: ${{ inputs.version }}

      - id: resolve
        env:
          PUBLISH: ${{ steps.ctx.outputs.publish }}
          VERSION: ${{ steps.ctx.outputs.version }}
          BUILD_DATE: ${{ steps.ctx.outputs.build_date }}
          BLOCK_NAME: ${{ inputs.block_name }}
          BALENA_NAMESPACE: ${{ inputs.balena_namespace }}
        run: |
          set -euo pipefail
          NS="$(printf '%s' "${BALENA_NAMESPACE}" | tr -d '[:space:]')"
          NAME="$(printf '%s' "${BLOCK_NAME}" | tr -d '[:space:]')"
          FLEET="${NS}/${NAME}"
          {
            echo "publish=${PUBLISH}"
            echo "version=${VERSION}"
            echo "fleet=${FLEET}"
            echo "build_date=${BUILD_DATE}"
          } >> "${GITHUB_OUTPUT}"
          echo "publish=${PUBLISH} version=${VERSION} fleet=${FLEET}"

  sync-balena-yml:
    name: Sync balena.yml
    needs: [preflight-runner-config, setup]
    # Skip when the manifest is rendered dynamically — there is no checked-in
    # `balena.yml` to keep in sync, every run regenerates the file with the
    # resolved version baked in.
    if: >-
      needs.setup.outputs.publish == 'true'
      && inputs.sync_balena_yml
      && !inputs.generate_balena_yml
      && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Presence and shape are enforced by `preflight-runner-config`.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Sync version into balena.yml
        env:
          BALENA_YML: ${{ inputs.balena_yml_path }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail

          # Reject path traversal / absolute paths; balena.yml must live in the repo.
          case "${BALENA_YML}" in
            /*|*..*) echo "ERROR: balena_yml_path must be a repo-relative path" >&2; exit 1 ;;
          esac
          [ -f "${BALENA_YML}" ] || { echo "ERROR: ${BALENA_YML} not found" >&2; exit 1; }

          # Validate version shape before injecting it into the file.
          case "${VERSION}" in
            ''|*[!A-Za-z0-9._+-]*)
              echo "ERROR: refusing to write unsafe version '${VERSION}' into ${BALENA_YML}" >&2
              exit 1 ;;
          esac

          # Top-level `version:` only (no leading whitespace).
          tmp="$(mktemp)"
          awk -v v="${VERSION}" '
            BEGIN { done = 0 }
            !done && /^version:[[:space:]]*/ { print "version: " v; done = 1; next }
            { print }
          ' "${BALENA_YML}" > "${tmp}"
          mv "${tmp}" "${BALENA_YML}"

          if git diff --quiet -- "${BALENA_YML}"; then
            echo "${BALENA_YML} already at ${VERSION}"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${BALENA_YML}"
          git commit -m "chore: sync balena block version to ${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  publish:
    name: Publish block
    needs: [preflight-runner-config, setup, sync-balena-yml]
    # `!cancelled()` keeps web-UI / API cancels from punching through this
    # gate: `always()` on its own returns true even after cancellation
    # (per GitHub docs), so without the explicit cancel check a click on
    # "Cancel workflow" mid-`sync-balena-yml` would still trigger a
    # balena release publish on the next runner.
    if: >-
      always()
      && !cancelled()
      && needs.setup.result == 'success'
      && needs.setup.outputs.publish == 'true'
      && (needs.sync-balena-yml.result == 'success' || needs.sync-balena-yml.result == 'skipped')
    # The shared publisher installs the native CLI for x64 or ARM64.
    # Callers can still pass `inputs.runs_on` for a per-call override.
    runs-on: ${{ fromJSON(startsWith(inputs.runs_on || vars.DEFAULT_RUNNER, '[') && (inputs.runs_on || vars.DEFAULT_RUNNER) || format('"{0}"', inputs.runs_on || vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 60
    outputs:
      release_id: ${{ steps.deploy.outputs.release_id }}
      # Mirrors the composite's `cache_hit` so callers (e.g. the
      # launchpad summary aggregator) can tell whether this run
      # actually built + pushed a new release or short-circuited on
      # an existing one tagged with the same commit SHA. Useful for
      # alerting on unexpected rebuilds in cache-by-SHA flows.
      cache_hit: ${{ steps.deploy.outputs.cache_hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync-balena-yml.result == 'success' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false

      - name: Render balena.yml
        if: inputs.generate_balena_yml
        uses: blackoutsecure/bos-automation-hub/.github/actions/render-balena-yml@main
        with:
          out_path: ${{ inputs.balena_yml_path }}
          name: ${{ inputs.block_name }}
          version: ${{ needs.setup.outputs.version }}
          block_type: ${{ inputs.block_type }}
          description: ${{ inputs.block_description }}
          post_provisioning: ${{ inputs.block_post_provisioning }}
          assets_repository_url: ${{ inputs.block_assets_repository_url }}
          assets_logo_url: ${{ inputs.block_assets_logo_url }}
          default_device_type: ${{ inputs.block_default_device_type }}
          supported_device_types: ${{ inputs.block_supported_device_types }}
          architectures: ${{ inputs.block_architectures }}
          platforms: ${{ inputs.block_platforms }}
          image_ref: ${{ inputs.block_image_ref }}

      - name: Publish to balenaCloud
        id: deploy
        # Wraps balena-cli directly instead of `balena-io/deploy-to-
        # balena-action` (which is a container action and breaks on
        # containerized self-hosted runners that share the host docker
        # socket — the action's `/github/workspace` bind-mount points
        # at a path that only exists inside the runner container, not
        # on the host's read-only rootfs). See
        # `.github/actions/balena-publish/action.yml` for the
        # full rationale; input contract is a strict subset.
        uses: blackoutsecure/bos-automation-hub/.github/actions/balena-publish@main
        with:
          balena_token: ${{ secrets.BALENA_API_TOKEN }}
          fleet: ${{ needs.setup.outputs.fleet }}
          source: ${{ inputs.source }}
          # `force: true` overrides `cache: true` so the action
          # always builds a fresh release even when a release already
          # exists for this commit SHA. `layer_cache` is untouched so
          # the rebuild still hits balena's layer cache and stays fast.
          #
          # NOTE: the obvious GHA ternary `inputs.force && false ||
          # inputs.cache` LOOKS right but is broken -- the literal
          # `false` in the true branch is itself falsy, so the `||`
          # short-circuits past it and returns `inputs.cache` (default
          # true) regardless of `inputs.force`. Use the inverted form
          # `!inputs.force && inputs.cache` instead: when force is true
          # it returns false; when force is false it returns whatever
          # `inputs.cache` is set to. Both shapes are stringified by GHA
          # to 'true'/'false' before being passed to the action.
          cache: ${{ !inputs.force && inputs.cache }}
          layer_cache: ${{ inputs.layer_cache }}
          debug: ${{ inputs.debug }}
          finalize: ${{ inputs.draft && 'false' || 'true' }}

      # Archive the exact `balena.yml` that was pushed to balenaCloud
      # so operators can inspect / diff the resolved manifest after the
      # fact without having to re-render locally. Covers BOTH modes:
      #   - generated mode: the file `render-balena-yml` wrote at
      #     `inputs.balena_yml_path` inside the checked-out workspace
      #   - checked-in mode: the same path, but the content is whatever
      #     was committed to the repo at the resolved `ref:`
      # `if: always() && hashFiles(...) != ''` makes the step a no-op
      # when the file is genuinely absent (e.g. wrong path, sync-only
      # run) instead of failing the job — operators still see the
      # publish + summary output in that case. Retained for 30 days
      # (artifact storage is per-org-quota; logs/SARIF live longer in
      # their own surfaces).
      - name: Upload balena.yml artifact
        if: always() && hashFiles(inputs.balena_yml_path) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: balena-yml-${{ inputs.block_name }}-${{ needs.setup.outputs.version }}
          path: ${{ inputs.balena_yml_path }}
          if-no-files-found: warn
          retention-days: 30

      # Comprehensive Job summary — surfaces every input + output the
      # operator needs to confirm what was published, without having to
      # cross-reference the workflow file or scroll through balena-cli
      # output. `if: always()` so the table appears even when the
      # `deploy` step failed (status row reflects job-level state).
      - name: Job summary
        if: always()
        shell: bash
        env:
          BLOCK_NAME: ${{ inputs.block_name }}
          FLEET: ${{ needs.setup.outputs.fleet }}
          VERSION: ${{ needs.setup.outputs.version }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
          COMMIT_SHA: ${{ github.sha }}
          SOURCE: ${{ inputs.source }}
          # Composite normalises to lowercase 'true'/'false' on stdout.
          CACHE_HIT: ${{ steps.deploy.outputs.cache_hit }}
          RELEASE_ID: ${{ steps.deploy.outputs.release_id }}
          MODE: ${{ inputs.draft && 'draft' || 'final' }}
          GENERATED_YML: ${{ inputs.generate_balena_yml && 'rendered in-runner' || 'checked-in' }}
          JOB_STATUS: ${{ job.status }}
          # Mirror the artifact-name expression in the upload step
          # above so the summary row shows the exact name the
          # operator will see in the "Artifacts" panel.
          ARTIFACT_NAME: balena-yml-${{ inputs.block_name }}-${{ needs.setup.outputs.version }}
          BALENA_YML_PATH: ${{ inputs.balena_yml_path }}
        run: |
          # Dashboard fleet URL uses the slug shape `<namespace>/<fleet>`,
          # which balenaCloud's dashboard redirects to the numeric fleet
          # id. The release page requires the numeric fleet id (slug
          # form doesn't redirect on the release subpath), so we link
          # the fleet page only and show the release id as text.
          fleet_url="https://dashboard.balena-cloud.com/fleets/${FLEET}"
          cache_label='no (built and pushed)'
          [ "${CACHE_HIT}" = 'true' ] && cache_label='yes (existing release reused)'
          # `hashFiles()` isn't available in shell, so re-check on the
          # runner filesystem. Matches the upload step's `if:` guard
          # exactly so the summary doesn't claim an artifact exists
          # when the upload step skipped.
          artifact_label='not produced (balena.yml missing at expected path)'
          if [ -f "${BALENA_YML_PATH}" ]; then
            artifact_label="\`${ARTIFACT_NAME}\` (30-day retention)"
          fi
          {
            echo "## Balena Block Publish"
            echo ""
            echo "| Field         | Value |"
            echo "|---------------|-------|"
            echo "| Block         | \`${BLOCK_NAME}\` |"
            echo "| Fleet         | [\`${FLEET}\`](${fleet_url}) |"
            echo "| Version       | \`${VERSION}\` |"
            echo "| Build date    | \`${BUILD_DATE}\` |"
            echo "| Commit SHA    | \`${COMMIT_SHA}\` |"
            echo "| Source path   | \`${SOURCE}\` |"
            echo "| balena.yml    | ${GENERATED_YML} |"
            echo "| Manifest path | \`${BALENA_YML_PATH}\` |"
            echo "| Artifact      | ${artifact_label} |"
            echo "| Mode          | \`${MODE}\` |"
            echo "| Cache hit     | ${cache_label} |"
            echo "| Release ID    | \`${RELEASE_ID:-n/a}\` |"
            echo "| Job status    | \`${JOB_STATUS}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
