name: 'Check: README header'
description: >-
  Validate that the repository's README.md starts with the canonical
  BlackOut Secure header pattern. Fails the workflow with a clear
  `::error::` annotation listing every missing or out-of-order element
  so authors can fix the header in a single PR pass.

  Two profiles are supported because the org publishes two distinct
  artifact families:

    * `marketplace` — `bos-*-kit` / `bos-*` Action repos published to
      the GitHub Marketplace. Header looks like:

        # Blackout Secure <Name>

        **Copyright © <years> Blackout Secure | Apache License 2.0**

        [![Marketplace](...marketplace badge...)](.../marketplace/actions/<slug>)
        [![GitHub release](...release badge...)](.../<owner>/<repo>/releases)
        [![License](...license badge...)](LICENSE)
        [![Made by BlackoutSecure](...made-by badge...)](https://github.com/blackoutsecure)

    * `docker` — `docker-*` Docker Hub-published service repos. Header
      looks like:

        <p align="center">
          <img src="...logo.png" alt="<name> logo" width="200">
        </p>

        # blackoutsecure/<service>

        [![GitHub Stars](...stars badge...)](.../stargazers)
        [![Docker Pulls](...pulls badge...)](.../docker hub...)
        [![GitHub Release](...release badge...)](.../releases)
        [![Blackout Secure Gatekeeper](...gatekeeper badge...)](.../actions/workflows/bos-universal-gatekeeper-kicker.yml)

      (Balena Hub badge may substitute for Gatekeeper on balena-only repos.)

  `auto` (default) detects the profile from `action.yml` presence at
  the repo root + `Dockerfile`/`docker-compose.yml` presence:

    * `action.yml` at root            -> `marketplace`
    * `Dockerfile` or `docker-compose.yml` at root, no `action.yml`
      -> `docker`
    * neither                          -> `generic` (only the
      `Made by BlackoutSecure` badge is required)

  This is a pure validator. It does NOT rewrite the README — drift is
  fixed by hand to keep the author in control of voice and tagline.

inputs:
  readme_path:
    description: >-
      Path to the README to validate, relative to the repo root.
      Defaults to `README.md`.
    required: false
    default: 'README.md'
  profile:
    description: >-
      One of `auto` | `marketplace` | `docker` | `generic`. `auto`
      detects from `action.yml` / `Dockerfile` presence at the repo root.
    required: false
    default: 'auto'
  org:
    description: >-
      Expected GitHub org/user slug used in badge URLs and repo links.
      Defaults to `blackoutsecure`.
    required: false
    default: 'blackoutsecure'
  fail_on_warning:
    description: >-
      `true` to fail the step on warnings (e.g. out-of-order badges).
      `false` (default) to emit `::warning::` and pass.
    required: false
    default: 'false'

outputs:
  outcome:
    description: >-
      Severity-tier verdict for the run: `success` (every applicable
      rule passed), `warn` (only warning-level findings), or `failure`
      (at least one required header element failed).
    value: ${{ steps.check.outputs.outcome }}
  fail_count:
    description: Number of failing (High) findings.
    value: ${{ steps.check.outputs.fail_count }}
  warn_count:
    description: Number of warning findings.
    value: ${{ steps.check.outputs.warn_count }}
  pass_count:
    description: Number of passing findings.
    value: ${{ steps.check.outputs.pass_count }}

runs:
  using: composite
  steps:
    - name: Validate README header
      id: check
      shell: bash
      env:
        README_PATH:     ${{ inputs.readme_path }}
        PROFILE_INPUT:   ${{ inputs.profile }}
        EXPECTED_ORG:    ${{ inputs.org }}
        FAIL_ON_WARNING: ${{ inputs.fail_on_warning }}
      run: |
        set -euo pipefail

        readme="${README_PATH:-README.md}"
        if [[ ! -f "$readme" ]]; then
          echo "::error title=README header check::README not found at '${readme}'."
          exit 1
        fi

        # ----------------------------------------------------------
        # Detect profile when caller asked for `auto`.
        # ----------------------------------------------------------
        profile="${PROFILE_INPUT:-auto}"
        if [[ "$profile" == "auto" ]]; then
          if [[ -f "action.yml" || -f "action.yaml" ]]; then
            profile="marketplace"
          elif [[ -f "Dockerfile" || -f "docker-compose.yml" || -f "docker-compose.yaml" ]]; then
            profile="docker"
          else
            profile="generic"
          fi
        fi

        case "$profile" in
          marketplace|docker|generic) ;;
          *)
            echo "::error title=README header check::Unknown profile '${profile}'. Expected one of: auto, marketplace, docker, generic."
            exit 1
            ;;
        esac

        echo "Profile: ${profile}"
        echo "README:  ${readme}"
        echo "Org:     ${EXPECTED_ORG}"
        echo ""

        # Inspect the top of the file (first ~25 non-empty lines is
        # plenty for any of our header patterns).
        head_block="$(head -n 30 "$readme")"

        # ----------------------------------------------------------
        # Findings ledger — parallel arrays of (rule, severity,
        # control, evidence, remediation), mirroring the rule/finding
        # model used by bos-code-scanning-kit's posture audit so every
        # BlackOut Secure gate reports the same shape: a rule ID, a
        # pass/warn/fail severity, and a fix-it remediation string.
        # ----------------------------------------------------------
        FIND_RULE=(); FIND_SEV=(); FIND_CONTROL=(); FIND_EVIDENCE=(); FIND_REMEDIATION=()
        add_finding() {
          FIND_RULE+=("$1"); FIND_SEV+=("$2"); FIND_CONTROL+=("$3")
          FIND_EVIDENCE+=("$4"); FIND_REMEDIATION+=("$5")
        }

        # RH00x — shared "Made by BlackoutSecure" badge (every profile).
        if grep -qE '\[!\[Made by BlackoutSecure\]\(https://img\.shields\.io/badge/made%20by-BlackoutSecure-[0-9a-fA-F]{6}' <<<"$head_block"; then
          add_finding "RH001" "pass" "Made by BlackoutSecure badge" "badge found in the header" "—"
        else
          add_finding "RH001" "fail" "Made by BlackoutSecure badge" "badge not found in the first 30 lines" \
            "Add \`[![Made by BlackoutSecure](https://img.shields.io/badge/made%20by-BlackoutSecure-1f1f1f)](https://github.com/${EXPECTED_ORG})\`"
        fi

        case "$profile" in
          # ------------------------------------------------------
          # Marketplace profile (bos-*-kit / Action repos).
          # ------------------------------------------------------
          marketplace)
            if grep -qE '^# Blackout Secure ' <<<"$head_block"; then
              add_finding "RH010" "pass" "Canonical H1 heading" "first heading matches \`# Blackout Secure <Name>\`" "—"
            else
              add_finding "RH010" "fail" "Canonical H1 heading" "first heading does not match the required pattern" \
                "Set the first heading to \`# Blackout Secure <Name>\` (Marketplace listing depends on the canonical org prefix)"
            fi

            if grep -qE '^\*\*Copyright © [0-9]{4}(-[0-9]{4})? Blackout Secure \| Apache License 2\.0\*\*$' <<<"$head_block"; then
              add_finding "RH011" "pass" "Copyright line" "copyright line present and correctly formatted" "—"
            else
              add_finding "RH011" "fail" "Copyright line" "copyright line missing or malformed" \
                "Add \`**Copyright © <year[-year]> Blackout Secure | Apache License 2.0**\`"
            fi

            if grep -qE '\[!\[Marketplace\]\(https://img\.shields\.io/badge/GitHub%20Marketplace-blue\?logo=github\)\]\(https://github\.com/marketplace/actions/' <<<"$head_block"; then
              add_finding "RH012" "pass" "Marketplace badge" "badge found" "—"
            else
              add_finding "RH012" "fail" "Marketplace badge" "badge not found" \
                "Add \`[![Marketplace](https://img.shields.io/badge/GitHub%20Marketplace-blue?logo=github)](https://github.com/marketplace/actions/<slug>)\`"
            fi

            if grep -qE '\[!\[GitHub release\]\(https://img\.shields\.io/github/v/release/'"${EXPECTED_ORG}"'/' <<<"$head_block"; then
              add_finding "RH013" "pass" "GitHub release badge" "badge found" "—"
            else
              add_finding "RH013" "fail" "GitHub release badge" "badge not found" \
                "Add \`[![GitHub release](https://img.shields.io/github/v/release/${EXPECTED_ORG}/<repo>?sort=semver)](https://github.com/${EXPECTED_ORG}/<repo>/releases)\`"
            fi

            if grep -qE '\[!\[License\]\(https://img\.shields\.io/badge/license-Apache%202\.0-blue\)\]\(LICENSE\)' <<<"$head_block"; then
              add_finding "RH014" "pass" "License badge" "badge found" "—"
            else
              add_finding "RH014" "fail" "License badge" "badge not found" \
                "Add \`[![License](https://img.shields.io/badge/license-Apache%202.0-blue)](LICENSE)\`"
            fi

            # Badge ORDER — find line numbers of each canonical badge
            # marker and verify monotonic. Out-of-order is a warning,
            # not a failure, because order is cosmetic.
            order_ok=1
            mp_line="$(grep -nE '^\[!\[Marketplace\]' "$readme" | head -n1 | cut -d: -f1 || true)"
            rel_line="$(grep -nE '^\[!\[GitHub release\]' "$readme" | head -n1 | cut -d: -f1 || true)"
            lic_line="$(grep -nE '^\[!\[License\]\(' "$readme" | head -n1 | cut -d: -f1 || true)"
            mby_line="$(grep -nE '^\[!\[Made by BlackoutSecure\]' "$readme" | head -n1 | cut -d: -f1 || true)"
            for pair in "$mp_line $rel_line" "$rel_line $lic_line" "$lic_line $mby_line"; do
              # shellcheck disable=SC2086
              set -- $pair
              a="${1:-0}"; b="${2:-0}"
              if [[ "$a" -gt 0 && "$b" -gt 0 && "$a" -ge "$b" ]]; then
                order_ok=0
              fi
            done
            if [[ "$order_ok" -eq 1 ]]; then
              add_finding "RH015" "pass" "Badge order" "badges appear in canonical order" "—"
            else
              add_finding "RH015" "warn" "Badge order" "badges are out of canonical order" \
                "Reorder badges to \`Marketplace -> GitHub release -> License -> Made by BlackoutSecure\`"
            fi
            ;;

          # ------------------------------------------------------
          # Docker profile (docker-* repos).
          # ------------------------------------------------------
          docker)
            if grep -qE '^<p align="center">' <<<"$head_block"; then
              add_finding "RH020" "pass" "Centered logo block" "logo block present" "—"
            else
              add_finding "RH020" "fail" "Centered logo block" "logo block missing" \
                "Add \`<p align=\"center\"><img src=\".../logo.png\" alt=\"<name> logo\" width=\"200\"></p>\`"
            fi

            if grep -qE '^# '"${EXPECTED_ORG}"'/[a-z0-9][a-z0-9._-]*$' <<<"$head_block"; then
              add_finding "RH021" "pass" "Canonical H1 heading" "first heading matches \`# ${EXPECTED_ORG}/<service>\`" "—"
            else
              add_finding "RH021" "fail" "Canonical H1 heading" "first heading does not match the required pattern" \
                "Set the first heading to \`# ${EXPECTED_ORG}/<service>\` (matches the published Docker Hub image name)"
            fi

            # Brand color (E7931D) and style (flat-square) are
            # enforced INSIDE each canonical-badge regex below — that
            # way author-added non-canonical badges (e.g. a GPLv3
            # license shield in blue, or vendor SVGs like the Balena
            # deploy button) don't trip a global brand-color sweep.
            if grep -qE '\[!\[GitHub Stars\]\(https://img\.shields\.io/github/stars/'"${EXPECTED_ORG}"'/[^)]*style=flat-square[^)]*color=E7931D' <<<"$head_block"; then
              add_finding "RH022" "pass" "GitHub Stars badge" "badge found with the correct brand color" "—"
            else
              add_finding "RH022" "fail" "GitHub Stars badge" "badge not found, or missing the E7931D brand color" \
                "Add \`[![GitHub Stars](https://img.shields.io/github/stars/${EXPECTED_ORG}/<repo>?style=flat-square&color=E7931D&logo=github)](.../stargazers)\`"
            fi

            if grep -qE '\[!\[Docker Pulls\]\(https://img\.shields\.io/docker/pulls/'"${EXPECTED_ORG}"'/[^)]*style=flat-square[^)]*color=E7931D' <<<"$head_block"; then
              add_finding "RH023" "pass" "Docker Pulls badge" "badge found with the correct brand color" "—"
            else
              add_finding "RH023" "fail" "Docker Pulls badge" "badge not found, or missing the E7931D brand color" \
                "Add \`[![Docker Pulls](https://img.shields.io/docker/pulls/${EXPECTED_ORG}/<image>?style=flat-square&color=E7931D&logo=docker&logoColor=FFFFFF)](https://hub.docker.com/r/${EXPECTED_ORG}/<image>)\`"
            fi

            if grep -qE '\[!\[GitHub Release\]\(https://img\.shields\.io/github/release/'"${EXPECTED_ORG}"'/[^)]*style=flat-square[^)]*color=E7931D' <<<"$head_block"; then
              add_finding "RH024" "pass" "GitHub Release badge" "badge found with the correct brand color" "—"
            else
              add_finding "RH024" "fail" "GitHub Release badge" "badge not found, or missing the E7931D brand color" \
                "Add \`[![GitHub Release](https://img.shields.io/github/release/${EXPECTED_ORG}/<repo>.svg?style=flat-square&color=E7931D&logo=github&logoColor=FFFFFF)](.../releases)\`"
            fi

            # Gatekeeper (or legacy Launchpad) OR Balena Hub badge is
            # acceptable as the 4th. Both must carry the brand color when
            # present. The legacy label stays accepted so a repo that has not
            # yet re-synced its README still passes this gate.
            if grep -qE '\[!\[Blackout Secure (Gatekeeper|Launchpad)\]\([^)]*color=E7931D|\[!\[Balena Hub\]\([^)]*-E7931D' <<<"$head_block"; then
              add_finding "RH025" "pass" "Gatekeeper-or-Balena badge" "badge found with the correct brand color" "—"
            else
              add_finding "RH025" "fail" "Gatekeeper-or-Balena badge" "badge not found, or missing the brand color" \
                "Add \`[![Blackout Secure Gatekeeper](.../bos-universal-gatekeeper-kicker.yml?style=flat-square&label=blackout%20secure%20gatekeeper&color=E7931D)](.../bos-universal-gatekeeper-kicker.yml)\` OR \`[![Balena Hub](https://img.shields.io/badge/balena%20hub-<name>-E7931D?style=flat-square&logo=balena&logoColor=FFFFFF)](https://hub.balena.io/blocks/<id>/<name>)\`"
            fi
            ;;

          # ------------------------------------------------------
          # Generic profile (sites, sub-repos, kits with no
          # publishing surface).
          # ------------------------------------------------------
          generic)
            if grep -qE '^# ' <<<"$head_block"; then
              add_finding "RH030" "pass" "Level-1 heading" "a level-1 heading is present" "—"
            else
              add_finding "RH030" "fail" "Level-1 heading" "no level-1 heading found" \
                "Add a first heading \`# <Title>\`"
            fi
            ;;
        esac

        # ----------------------------------------------------------
        # Roll up totals + verdict, mirroring
        # bos-code-scanning-kit's posture-audit report: a `Verdict`
        # line, a severity-count table, recommended actions, and a
        # per-family findings table with Rule / Severity / Control /
        # Evidence / Recommended Remediation columns.
        # ----------------------------------------------------------
        fails=0; warns=0; passes=0
        for sev in "${FIND_SEV[@]}"; do
          case "$sev" in
            fail) fails=$((fails + 1)) ;;
            warn) warns=$((warns + 1)) ;;
            pass) passes=$((passes + 1)) ;;
          esac
        done

        if (( fails > 0 )); then
          outcome="failure"
          verdict="Action required"
          verdict_detail="One or more required header elements did not meet the canonical \`${profile}\` pattern."
        elif (( warns > 0 )); then
          outcome="warn"
          verdict="Advisory review recommended"
          verdict_detail="No blocking failures were detected, but one or more elements should be reviewed."
        else
          outcome="success"
          verdict="Controls passed"
          verdict_detail="No failing or warning-level header findings were detected."
        fi

        actions=()
        (( fails > 0 )) && actions+=("Fix the High findings below; the canonical header is required for the \`${profile}\` profile.")
        (( warns > 0 )) && actions+=("Review the Warning findings during the next documentation pass.")
        if (( fails == 0 && warns == 0 )); then
          actions+=("Maintain the current header — no changes needed.")
        fi
        actions+=("Re-run this check after editing the README to confirm the fix.")

        severity_label() {
          case "$1" in
            pass) echo "Pass" ;;
            warn) echo "Warning" ;;
            fail) echo "High" ;;
            *)    echo "$1" ;;
          esac
        }

        # ─── Console echo ──────────────────────────────────────────
        echo ""
        echo "━━ Blackout Secure README Header Audit — outcome: ${outcome} ━━"
        for i in "${!FIND_RULE[@]}"; do
          printf '  %-6s %-8s %s: %s\n' "${FIND_RULE[$i]}" "${FIND_SEV[$i]}" \
            "${FIND_CONTROL[$i]}" "${FIND_EVIDENCE[$i]}"
        done
        echo "  verdict: ${verdict} — ${verdict_detail}"
        echo ""

        # ─── Step summary (audit-report format) ────────────────────
        {
          echo "# Blackout Secure README Header Audit"
          echo ""
          echo "**Provided by [Blackout Secure](https://blackoutsecure.app)**"
          echo ""
          echo "## Summary"
          echo ""
          echo "**Profile:** \`${profile}\`  "
          echo "**README:** \`${readme}\`"
          echo ""
          echo "**Verdict:** ${verdict}"
          echo ""
          echo "${verdict_detail}"
          echo ""
          echo "**Totals:** ${passes} pass · ${warns} warning · ${fails} high"
          echo ""
          echo "| Severity | Count | Meaning |"
          echo "| -------- | ----- | ------- |"
          echo "| Pass | ${passes} | Header element matches the canonical pattern. |"
          echo "| Warning | ${warns} | Cosmetic drift; review recommended but not blocking by itself. |"
          echo "| High | ${fails} | Required header element is missing or incorrect. |"
          echo ""
          echo "## Recommended Actions"
          echo ""
          for action in "${actions[@]}"; do
            echo "- ${action}"
          done
          echo ""
          echo "## Detailed Findings"
          echo ""
          for prefix in RH00 RH01 RH02 RH03; do
            rows=()
            for i in "${!FIND_RULE[@]}"; do
              if [[ "${FIND_RULE[$i]:0:4}" == "$prefix" ]]; then
                rows+=("$i")
              fi
            done
            [[ ${#rows[@]} -eq 0 ]] && continue
            case "$prefix" in
              RH00) header="Shared badge";      blurb="Present in every generated README regardless of profile" ;;
              RH01) header="Marketplace header"; blurb="Canonical BlackOut Secure Marketplace Action header" ;;
              RH02) header="Docker header";      blurb="Canonical BlackOut Secure Docker Hub header" ;;
              RH03) header="Generic header";     blurb="Minimum heading requirement for repos with no publishing surface" ;;
            esac
            echo "### ${header}"
            echo "_${blurb}_"
            echo ""
            echo "| Rule | Severity | Control | Evidence | Recommended Remediation |"
            echo "| ---- | -------- | ------- | -------- | ------------------------ |"
            for i in "${rows[@]}"; do
              sev_label="$(severity_label "${FIND_SEV[$i]}")"
              echo "| \`${FIND_RULE[$i]}\` | ${sev_label} | ${FIND_CONTROL[$i]} | ${FIND_EVIDENCE[$i]} | ${FIND_REMEDIATION[$i]} |"
            done
            echo ""
          done
          echo "---"
          echo ""
          echo "_This report was generated by the Blackout Secure README header check, part of \`bos-universal-security.yml\`._"
        } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

        # ─── Workflow annotations ───────────────────────────────────
        for i in "${!FIND_RULE[@]}"; do
          case "${FIND_SEV[$i]}" in
            fail)
              echo "::error title=README header check,file=${readme}::${FIND_CONTROL[$i]}: ${FIND_EVIDENCE[$i]} — ${FIND_REMEDIATION[$i]}"
              ;;
            warn)
              echo "::warning title=README header check,file=${readme}::${FIND_CONTROL[$i]}: ${FIND_EVIDENCE[$i]} — ${FIND_REMEDIATION[$i]}"
              ;;
          esac
        done

        {
          echo "outcome=${outcome}"
          echo "fail_count=${fails}"
          echo "warn_count=${warns}"
          echo "pass_count=${passes}"
        } >>"${GITHUB_OUTPUT:-/dev/null}"

        if (( fails > 0 )); then
          exit 1
        fi
        if [[ "${FAIL_ON_WARNING}" == "true" && "${warns}" -gt 0 ]]; then
          exit 1
        fi
