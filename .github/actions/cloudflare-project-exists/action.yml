name: Cloudflare Pages project existence check
description: >-
  Verifies a Cloudflare Pages project already exists for the given
  account via the Cloudflare API (GET .../pages/projects/<name>). Fails
  with an actionable error on 404 so a deploy stops BEFORE wrangler
  emits a confusing failure (or silently creates an unintended
  project). Emits the project's production branch on success so callers
  can decide production vs preview without a second API round trip.

inputs:
  account_id:
    description: >-
      Cloudflare account ID (32-char lowercase hex). Typically the
      resolved output of `shared/cloudflare-resolve-id`.
    required: true
  project_name:
    description: 'Cloudflare Pages project name (lowercase a-z, 0-9, "-").'
    required: true
  api_token:
    description: >-
      Cloudflare API token with at least `Account → Cloudflare Pages →
      Read` for the target account. The same token used by the deploy
      (which carries `Pages → Edit`) satisfies this.
    required: true

outputs:
  exists:
    description: >-
      Always `'true'` when the step succeeds — the action fails the job
      when the project is absent, so a `true` value is the only success
      path. Exposed for readability in downstream `if:` guards.
    value: ${{ steps.check.outputs.exists }}
  production_branch:
    description: "The project's configured production branch (may be empty)."
    value: ${{ steps.check.outputs.production_branch }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        ACCOUNT_ID: ${{ inputs.account_id }}
        PROJECT_NAME: ${{ inputs.project_name }}
        API_TOKEN: ${{ inputs.api_token }}
      run: |
        set -euo pipefail

        ACCOUNT_ID="$(printf '%s' "${ACCOUNT_ID}" | tr -d '[:space:]')"
        PROJECT_NAME="$(printf '%s' "${PROJECT_NAME}" | tr -d '[:space:]')"

        if ! printf '%s' "${ACCOUNT_ID}" | grep -Eq '^[0-9a-f]{32}$'; then
          echo "::error::Cloudflare account ID must be a 32-char lowercase hex string" >&2
          exit 1
        fi
        # Cloudflare Pages project names: lowercase a-z, 0-9 and '-',
        # 1-58 chars, can't start or end with '-'.
        if ! printf '%s' "${PROJECT_NAME}" \
          | grep -Eq '^[a-z0-9]([a-z0-9-]{0,56}[a-z0-9])?$'; then
          echo "::error::'${PROJECT_NAME}' is not a valid Cloudflare Pages project name" >&2
          exit 1
        fi
        if [ -z "${API_TOKEN}" ]; then
          echo "::error::a Cloudflare API token is required" >&2
          exit 1
        fi
        case "${API_TOKEN}" in
          *[$'\n\r\t ']*)
            echo "::error::Cloudflare API token contains whitespace/newlines" >&2
            exit 1 ;;
        esac

        BODY_FILE="${RUNNER_TEMP:-/tmp}/cf_project_exists.json"
        HTTP_CODE="$(curl -sS \
          -o "${BODY_FILE}" \
          -w '%{http_code}' \
          -H "Authorization: Bearer ${API_TOKEN}" \
          -H "Accept: application/json" \
          -H "User-Agent: bos-automation-hub/cloudflare-project-exists" \
          "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT_NAME}")"

        case "${HTTP_CODE}" in
          200)
            ;;
          404)
            echo "::error::Cloudflare Pages project '${PROJECT_NAME}' was not found in account ${ACCOUNT_ID}. Create it first (Cloudflare dashboard → Workers & Pages → Create, or 'wrangler pages project create ${PROJECT_NAME}') before deploying." >&2
            exit 1 ;;
          401|403)
            echo "::error::Cloudflare API rejected the token (HTTP ${HTTP_CODE}) when checking project '${PROJECT_NAME}'. The token needs 'Account → Cloudflare Pages → Read' for account ${ACCOUNT_ID}." >&2
            exit 1 ;;
          *)
            echo "::error::Unexpected HTTP ${HTTP_CODE} from the Cloudflare API while checking project '${PROJECT_NAME}'." >&2
            echo "--- response body ---" >&2
            cat "${BODY_FILE}" >&2 || true
            exit 1 ;;
        esac

        PROD_BRANCH="$(python3 - "${BODY_FILE}" <<'PY'
        import json, sys

        with open(sys.argv[1], encoding="utf-8") as fh:
            data = json.load(fh)
        if not data.get("success", False):
            errs = data.get("errors") or []
            detail = "; ".join(
                f"{e.get('code', '?')}: {e.get('message', '?')}" for e in errs
            ) or "unknown error"
            sys.exit(f"Cloudflare API returned success=false: {detail}")
        result = data.get("result") or {}
        print((result.get("production_branch") or "").strip())
        PY
        )"

        echo "Cloudflare Pages project '${PROJECT_NAME}' exists (production branch: ${PROD_BRANCH:-unknown})."
        {
          echo "exists=true"
          echo "production_branch=${PROD_BRANCH}"
        } >> "${GITHUB_OUTPUT}"
