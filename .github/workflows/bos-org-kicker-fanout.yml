# Organization-wide kicker fan-out (hub-only; never synced to member repos).
#
# Dispatches one of the universal kickers across every repository in the
# organization that already has that kicker installed. Requires an
# Actions: write / Metadata: read credential covering the org, because the
# job-scoped GITHUB_TOKEN cannot dispatch workflows in other repositories.
#
# Delivery is by dispatching each target's *own* copy of the kicker, which
# leaves a bootstrap gap: a repository that has never received the kicker has
# nothing to dispatch, so it can never be reached and would sit outside org
# automation indefinitely. `seed_missing` closes that gap by opening a pull
# request that installs `sync-files/workflows/<kicker>` into the target's
# default branch — the branch that matters, because GitHub only fires
# `schedule` triggers and only offers `workflow_dispatch` for workflows
# present on the default branch. Seeding is a pull request, never a direct
# push, so branch protection stays authoritative. Once merged, the managed
# file sync (`file` mode) keeps the copy current and the seed never recurs.
# Seeding uses the workflow-sync App rather than widening the dispatch App:
# GITHUB_TOKEN cannot write `.github/workflows/`, and dispatch has no reason
# to hold code-write access. Legacy PAT names remain rollout fallbacks only.
#
# Before dispatching, `audit_targets` (default `warn`) checks each target's
# kicker file for an unguarded `workflow_dispatch:` trigger — one with no
# detected `bos-workflow-gatekeeper` authorization step of its own. That
# combination means anyone with dispatch access to the target repo can
# trigger the kicker directly, bypassing this fan-out's own trust boundary
# entirely. `warn` logs the finding and still dispatches, `block` skips that
# repository, `off` skips the check (and its extra API call).
#
# `kicker` is a static `type: choice` enum, not freeform text: GitHub itself
# rejects a dispatch whose value isn't in `options`, so that list is already
# the hard ceiling on what can ever be selected (a config file can't widen
# it — GitHub renders the dropdown from the YAML, not from any external
# source). What a config CAN do is narrow that ceiling at runtime: this
# workflow additionally reads `organization.kicker_fanout.enabled_kickers`
# from this hub's own `.github/bos-universal-config.json` and refuses to run
# a kicker that isn't listed there. That gives operators a single, auditable
# place to shrink the effective set (e.g. disable `launchpad` fan-out
# org-wide during an incident) without editing this workflow file. Empty or
# missing config means "no additional restriction" — every enum value stays
# allowed, matching the behavior before this check existed.
name: Blackout Secure Org Kicker Fan-Out

run-name: >-
  Org fan-out / ${{ inputs.kicker }}${{ inputs.dry_run && ' (dry run)' || '' }}

"on":
  workflow_dispatch:
    inputs:
      kicker:
        description: "Which universal kicker to run in every repository."
        required: true
        type: choice
        options:
          - gatekeeper
        default: gatekeeper
      repos:
        description: >-
          Optional comma- or space-separated repository filter. Accepts bare
          names or `owner/name`, and `*` globs. Empty targets the whole org.
        required: false
        type: string
        default: ""
      dispatch_inputs:
        description: >-
          Optional JSON object of inputs forwarded to the kicker, e.g.
          {"mode":"check"}. Empty uses each kicker's own defaults.
        required: false
        type: string
        default: ""
      include_forks:
        description: "Include forked repositories."
        required: false
        type: boolean
        default: false
      include_archived:
        description: "Include archived repositories."
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Resolve and report targets without dispatching."
        required: false
        type: boolean
        default: true
      audit_targets:
        description: >-
          Before dispatching, check whether each target repository's kicker
          file exposes an unguarded `workflow_dispatch:` trigger (no detected
          `bos-workflow-gatekeeper` authorization step). `warn` logs a warning
          and still dispatches; `block` skips that repository; `off` skips the
          check entirely.
        required: false
        type: choice
        options: [warn, block, off]
        default: warn
      seed_missing:
        description: >-
          Install the kicker in repositories that do not have it yet, by
          opening a pull request against their default branch. `pr` seeds and
          skips dispatch for that repository this run (the next fan-out picks
          it up once merged); `off` leaves such repositories untouched.
        required: false
        type: choice
        options: [pr, off]
        default: pr

permissions:
  contents: read

concurrency:
  group: org-kicker-fanout-${{ inputs.kicker }}
  cancel-in-progress: false

jobs:
  fanout:
    name: Fan out ${{ inputs.kicker }} kicker
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 30
    steps:
      - name: Mint dispatch token
        id: dispatch-app
        if: vars.GATEWALL_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GATEWALL_APP_ID }}
          private-key: ${{ secrets.GATEWALL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          permission-contents: read

      - name: Mint workflow synchronization token
        id: workflow-app
        if: vars.GATEWALL_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GATEWALL_APP_ID }}
          private-key: ${{ secrets.GATEWALL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Validate credential
        env:
          HAS_TOKEN: ${{ (steps.dispatch-app.outputs.token || secrets.ORG_KICK_PAT || secrets.DISPATCH_TOKEN) != '' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "::error::Cross-repository dispatch needs an org-scoped credential." \
                 "Configure the dispatch GitHub App profile with Actions: write" \
                 "on all participating repositories."
            exit 1
          fi

      - name: Checkout org config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/bos-universal-config.json
            sync-files/workflows/**
          sparse-checkout-cone-mode: false

      - name: Enforce config-driven kicker allowlist
        env:
          KICKER: ${{ inputs.kicker }}
        run: |
          set -euo pipefail
          config=.github/bos-universal-config.json
          [ -f "${config}" ] || exit 0
          enabled=$(jq -r '.organization.kicker_fanout.enabled_kickers // [] | .[]' "${config}" 2>/dev/null || true)
          if [ -z "${enabled}" ]; then
            exit 0
          fi
          if ! grep -qxF "${KICKER}" <<< "${enabled}"; then
            echo "::error::kicker '${KICKER}' is not in organization.kicker_fanout.enabled_kickers" \
                 "(.github/bos-universal-config.json). Add it there to allow this fan-out."
            exit 1
          fi

      - name: Resolve targets and dispatch
        env:
          GH_TOKEN: ${{ steps.dispatch-app.outputs.token || secrets.ORG_KICK_PAT || secrets.DISPATCH_TOKEN }}
          ORG: ${{ github.repository_owner }}
          KICKER: ${{ inputs.kicker }}
          REPO_FILTER: ${{ inputs.repos }}
          DISPATCH_INPUTS: ${{ inputs.dispatch_inputs }}
          INCLUDE_FORKS: ${{ inputs.include_forks }}
          INCLUDE_ARCHIVED: ${{ inputs.include_archived }}
          DRY_RUN: ${{ inputs.dry_run }}
          AUDIT_TARGETS: ${{ inputs.audit_targets }}
          SEED_MISSING: ${{ inputs.seed_missing }}
          SEED_TOKEN: ${{ steps.workflow-app.outputs.token || secrets.WORKFLOW_SYNC_PAT || secrets.ORG_KICK_PAT || secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          WORKFLOW_FILE="bos-universal-${KICKER}-kicker.yml"
          SEED_SOURCE="sync-files/workflows/${WORKFLOW_FILE}"
          DEST_PATH=".github/workflows/${WORKFLOW_FILE}"
          SEED_BRANCH="chore/seed-${WORKFLOW_FILE%.yml}"

          # Empty means "do not seed", whether disabled or unavailable.
          KICKER_B64=""
          if [ "${SEED_MISSING}" = "pr" ]; then
            if [ ! -f "${SEED_SOURCE}" ]; then
              echo "::warning::Seeding requested but ${SEED_SOURCE} is not in this hub;" \
                   "repositories without ${WORKFLOW_FILE} will be skipped instead."
            elif [ -z "${SEED_TOKEN}" ]; then
                  echo "::warning::Seeding requested but no workflow-sync App or legacy PAT is configured;" \
                    "writes under .github/workflows/ need Workflows write." \
                   "Repositories without ${WORKFLOW_FILE} will be skipped instead."
            else
              KICKER_B64=$(base64 -w0 < "${SEED_SOURCE}")
            fi
          fi

          PR_BODY=$(printf '%s\n' \
            "Installs the organization-managed \`${DEST_PATH}\` from [bos-automation-hub](https://github.com/${ORG}/bos-automation-hub)." \
            "" \
            "The org fan-out dispatches each repository's own kicker, so a repository without one cannot be reached by hub automation at all." \
            "This pull request delivers the file once; afterwards the managed file sync keeps it current and this will not reappear." \
            "" \
            "To decline hub automation, set the repository variable \`AUTO_HUB_SYNC\` to \`false\`.")

          # Build `-f key=value` flags from the optional JSON input object.
          FLAGS=()
          if [ -n "${DISPATCH_INPUTS//[[:space:]]/}" ]; then
            while IFS= read -r pair; do
              FLAGS+=(-f "${pair}")
            done < <(printf '%s' "${DISPATCH_INPUTS}" \
              | jq -r 'to_entries[] | "\(.key)=\(.value)"')
          fi

          discovery_error="${RUNNER_TEMP}/kicker-discovery-error"
          : > "${discovery_error}"
          mapfile -t CANDIDATES < <(
            gh api --paginate "installation/repositories?per_page=100" \
              --jq '.repositories[]' 2>"${discovery_error}" \
              | jq -r --arg org "${ORG}" 'select(.owner.login == $org and (.disabled | not))
                        | [.full_name, (.fork|tostring), (.archived|tostring), .default_branch]
                        | @tsv'
          )
          if [ ! -s "${discovery_error}" ] && [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "::error::Gatewall installation repository discovery returned zero repositories for '${ORG}'."
            exit 1
          fi
          if [ -s "${discovery_error}" ]; then
            echo "::error::Gatewall installation repository discovery failed: $(tr '\n' ' ' < "${discovery_error}")"
            exit 1
          fi

          matches_filter() {
            local name="$1" short="${1#*/}" token
            [ -z "${REPO_FILTER//[[:space:]]/}" ] && return 0
            for token in ${REPO_FILTER//,/ }; do
              # shellcheck disable=SC2254
              case "${name}" in ${token}) return 0 ;; esac
              # shellcheck disable=SC2254
              case "${short}" in ${token}) return 0 ;; esac
            done
            return 1
          }

          # Best-effort static check: does the target's kicker file expose a
          # `workflow_dispatch:` trigger with no `bos-workflow-gatekeeper`
          # authorization step of its own? If so, anyone with dispatch access
          # to that repository can trigger it directly, bypassing this
          # fan-out's own trust boundary entirely. A text scan, not a full
          # YAML parse — cheap and conservative rather than exhaustive.
          audit_target() {
            local full_name="$1" ref="$2" content
            content=$(gh api "repos/${full_name}/contents/.github/workflows/${WORKFLOW_FILE}?ref=${ref}" \
              --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null || true)
            if [ -z "${content}" ]; then
              echo unknown
              return
            fi
            if printf '%s' "${content}" | grep -Eq '^[[:space:]]*workflow_dispatch[[:space:]]*:' \
               && ! printf '%s' "${content}" | grep -qi 'bos-workflow-gatekeeper'; then
              echo insecure
              return
            fi
            echo secure
          }

          # Install the kicker in a repository that has none, via a pull
          # request against its default branch. Emits `<status><TAB><detail>`;
          # every failure mode is reported rather than fatal, so one
          # unwritable repository cannot abort the whole fan-out. Runs on
          # SEED_TOKEN throughout — the dispatch token may be read-only here.
          seed_target() {
            local full_name="$1" base_ref="$2"
            local base_sha blob_sha url
            local put_args=()

            url=$(GH_TOKEN="${SEED_TOKEN}" gh api "repos/${full_name}/pulls?state=open&head=${ORG}:${SEED_BRANCH}" \
              --jq '.[0].html_url // empty' 2>/dev/null || true)
            if [ -n "${url}" ]; then
              printf 'pending\t%s\n' "${url}"
              return 0
            fi

            base_sha=$(GH_TOKEN="${SEED_TOKEN}" gh api "repos/${full_name}/git/ref/heads/${base_ref}" \
              --jq '.object.sha' 2>/dev/null || true)
            if [ -z "${base_sha}" ]; then
              printf 'failed\tcannot read default branch %s\n' "${base_ref}"
              return 0
            fi

            # Failure here means the branch already exists from an earlier
            # partial attempt; the content write below reconciles it.
            GH_TOKEN="${SEED_TOKEN}" gh api --method POST "repos/${full_name}/git/refs" \
              -f "ref=refs/heads/${SEED_BRANCH}" -f "sha=${base_sha}" \
              >/dev/null 2>&1 || true

            blob_sha=$(GH_TOKEN="${SEED_TOKEN}" gh api "repos/${full_name}/contents/${DEST_PATH}?ref=${SEED_BRANCH}" \
              --jq '.sha // empty' 2>/dev/null || true)
            if [ -n "${blob_sha}" ]; then
              put_args+=(-f "sha=${blob_sha}")
            fi

            if ! GH_TOKEN="${SEED_TOKEN}" gh api --method PUT "repos/${full_name}/contents/${DEST_PATH}" \
                 -f "message=chore: install ${WORKFLOW_FILE} from the automation hub" \
                 -f "content=${KICKER_B64}" \
                 -f "branch=${SEED_BRANCH}" \
                 "${put_args[@]+"${put_args[@]}"}" >/dev/null 2>&1; then
              printf 'failed\tcontents write rejected; WORKFLOW_SYNC_PAT needs Contents and Workflows write\n'
              return 0
            fi

            url=$(GH_TOKEN="${SEED_TOKEN}" gh api --method POST "repos/${full_name}/pulls" \
              -f "title=Install ${WORKFLOW_FILE}" \
              -f "head=${SEED_BRANCH}" \
              -f "base=${base_ref}" \
              -f "body=${PR_BODY}" \
              --jq '.html_url' 2>/dev/null || true)
            if [ -z "${url}" ]; then
              printf 'failed\tbranch pushed but pull request could not be opened; needs Pull requests write\n'
              return 0
            fi
            printf 'seeded\t%s\n' "${url}"
          }

          {
            echo "### Org kicker fan-out: \`${WORKFLOW_FILE}\`"
            echo
            echo "| Repository | Result |"
            echo "| --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"

          dispatched=0
          seeded=0
          skipped=0
          failed=0

          for row in "${CANDIDATES[@]}"; do
            IFS=$'\t' read -r full_name is_fork is_archived default_branch <<< "${row}"
            matches_filter "${full_name}" || continue
            if [ "${is_fork}" = "true" ] && [ "${INCLUDE_FORKS}" != "true" ]; then
              continue
            fi
            if [ "${is_archived}" = "true" ] && [ "${INCLUDE_ARCHIVED}" != "true" ]; then
              continue
            fi

            # Per-repo opt-out: a repository variable named `AUTO_HUB_SYNC`
            # set to `false` skips this repo entirely, regardless of the
            # dry-run/manual distinction below. Missing variable (404) or any
            # other value means "participate" (opt-out, not opt-in). Checked
            # ahead of the seed below so opting out also declines the seed.
            opt_out_value=$(gh api "repos/${full_name}/actions/variables/AUTO_HUB_SYNC" \
              --jq '.value' 2>/dev/null || true)
            if [ "${opt_out_value}" = "false" ]; then
              echo "| ${full_name} | skipped (AUTO_HUB_SYNC=false) |" >> "${GITHUB_STEP_SUMMARY}"
              skipped=$((skipped + 1))
              continue
            fi

            if ! gh api "repos/${full_name}/actions/workflows/${WORKFLOW_FILE}" \
                 --silent >/dev/null 2>&1; then
              if [ -z "${KICKER_B64}" ]; then
                echo "| ${full_name} | skipped (no ${WORKFLOW_FILE}) |" >> "${GITHUB_STEP_SUMMARY}"
                skipped=$((skipped + 1))
                continue
              fi
              if [ "${DRY_RUN}" = "true" ]; then
                echo "| ${full_name} | would seed ${WORKFLOW_FILE} into \`${default_branch}\` |" >> "${GITHUB_STEP_SUMMARY}"
                seeded=$((seeded + 1))
                continue
              fi
              IFS=$'\t' read -r seed_status seed_detail \
                < <(seed_target "${full_name}" "${default_branch}")
              case "${seed_status}" in
                seeded)
                  echo "| ${full_name} | seeded ([pull request](${seed_detail})) |" >> "${GITHUB_STEP_SUMMARY}"
                  seeded=$((seeded + 1))
                  ;;
                pending)
                  echo "| ${full_name} | seed [pull request](${seed_detail}) already open |" >> "${GITHUB_STEP_SUMMARY}"
                  seeded=$((seeded + 1))
                  ;;
                *)
                  echo "::warning::${full_name}: could not seed ${WORKFLOW_FILE} — ${seed_detail}"
                  echo "| ${full_name} | :warning: seed failed (${seed_detail}) |" >> "${GITHUB_STEP_SUMMARY}"
                  skipped=$((skipped + 1))
                  ;;
              esac
              continue
            fi

            if [ "${AUDIT_TARGETS}" != "off" ]; then
              audit_status=$(audit_target "${full_name}" "${default_branch}")
              if [ "${audit_status}" = "insecure" ]; then
                if [ "${AUDIT_TARGETS}" = "block" ]; then
                  echo "| ${full_name} | :no_entry: blocked (${WORKFLOW_FILE} exposes workflow_dispatch with no gatekeeper step) |" >> "${GITHUB_STEP_SUMMARY}"
                  skipped=$((skipped + 1))
                  continue
                fi
                echo "::warning::${full_name}'s ${WORKFLOW_FILE} exposes workflow_dispatch with no detected bos-workflow-gatekeeper step."
              fi
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "| ${full_name} | would dispatch |" >> "${GITHUB_STEP_SUMMARY}"
              dispatched=$((dispatched + 1))
              continue
            fi

            if gh workflow run "${WORKFLOW_FILE}" \
                 --repo "${full_name}" "${FLAGS[@]+"${FLAGS[@]}"}"; then
              echo "| ${full_name} | dispatched |" >> "${GITHUB_STEP_SUMMARY}"
              dispatched=$((dispatched + 1))
            else
              echo "| ${full_name} | :x: dispatch failed |" >> "${GITHUB_STEP_SUMMARY}"
              failed=$((failed + 1))
            fi
          done

          {
            echo
            echo "Dispatched: ${dispatched} | seeded: ${seeded} | skipped: ${skipped} | failed: ${failed}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${failed}" -gt 0 ]; then
            echo "::error::${failed} repository dispatch(es) failed."
            exit 1
          fi
