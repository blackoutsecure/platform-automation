name: Job report
author: Blackout Secure
description: >-
  Generate a standardized Markdown and HTML audit report for GitHub Actions.
  The report includes findings, evidence, configuration provenance, GitHub
  links, recommendations, annotations, and an open-source disclaimer.
branding:
  icon: shield
  color: orange
inputs:
  title:
    description: Report title.
    required: true
  findings:
    description: JSON array of id, severity, control, evidence, remediation, and group objects.
    required: false
    default: "[]"
  groups:
    description: JSON object mapping group names to title and blurb.
    required: false
    default: "{}"
  context_rows:
    description: JSON array of label, value, and meaning configuration rows.
    required: false
    default: "[]"
  automation_policy:
    description: >-
      JSON object describing recommendation, release, promotion, and
      auto-merge policy. Defaults to notify-only with auto-merge disabled.
    required: false
    default: '{"recommendation_action":"notify","release_action":"notify","promotion_action":"notify","scorecard_action":"notify","allow_auto_merge":false}'
  subject:
    description: Optional report subject.
    required: false
    default: ""
  fail_on:
    description: fail, warn, or never.
    required: false
    default: fail
  enable_summary:
    description: Write the GitHub Step Summary.
    required: false
    default: "true"
  enable_annotations:
    description: Emit GitHub error and warning annotations.
    required: false
    default: "true"
  footer:
    description: Optional report footer text.
    required: false
    default: ""
  html_path:
    description: Standalone HTML report path.
    required: false
    default: blackout-secure-report.html
  enable_html:
    description: Generate the standalone HTML report.
    required: false
    default: "true"
  enable_pdf:
    description: Attempt PDF export with an installed Chromium or Chrome binary.
    required: false
    default: "false"
  pdf_path:
    description: Optional PDF report path.
    required: false
    default: blackout-secure-report.pdf
  enable_json:
    description: Generate a machine-readable JSON report alongside Markdown/HTML.
    required: false
    default: "false"
  json_path:
    description: JSON report path.
    required: false
    default: blackout-secure-report.json
  enable_automation_policy:
    description: Render the "Automation policy" section. Set false for callers with no automation-policy concept.
    required: false
    default: "true"
  brand_name:
    description: Report byline and footer brand name.
    required: false
    default: Blackout Secure
  brand_url:
    description: Report byline and footer brand URL.
    required: false
    default: https://blackoutsecure.app
  license_notice:
    description: License string shown in the report footer.
    required: false
    default: Apache License 2.0
  enable_artifact_upload:
    description: Upload the generated HTML/PDF/JSON reports as a workflow artifact.
    required: false
    default: "false"
  artifact_name:
    description: Artifact name used when enable_artifact_upload is true.
    required: false
    default: blackout-secure-audit-report
outputs:
  outcome:
    description: success, warn, or failure based on finding severity.
    value: ${{ steps.report.outputs.outcome }}
  verdict:
    description: Human-readable verdict.
    value: ${{ steps.report.outputs.verdict }}
  passes:
    description: Pass finding count.
    value: ${{ steps.report.outputs.passes }}
  warns:
    description: Warning finding count.
    value: ${{ steps.report.outputs.warns }}
  fails:
    description: High finding count.
    value: ${{ steps.report.outputs.fails }}
  skips:
    description: Not Assessed finding count.
    value: ${{ steps.report.outputs.skips }}
  total:
    description: Total finding count.
    value: ${{ steps.report.outputs.total }}
  html_path:
    description: Generated HTML path.
    value: ${{ steps.report.outputs.html_path }}
  pdf_path:
    description: Generated PDF path when available.
    value: ${{ steps.report.outputs.pdf_path }}
  pdf_status:
    description: generated, unavailable, or disabled.
    value: ${{ steps.report.outputs.pdf_status }}
  json_path:
    description: Generated JSON report path, when enable_json is true.
    value: ${{ steps.report.outputs.json_path }}
runs:
  using: composite
  steps:
    - name: Render audit report
      id: report
      shell: bash
      env:
        REPORT_TITLE: ${{ inputs.title }}
        REPORT_FINDINGS: ${{ inputs.findings }}
        REPORT_GROUPS: ${{ inputs.groups }}
        REPORT_CONTEXT_ROWS: ${{ inputs.context_rows }}
        REPORT_AUTOMATION_POLICY: ${{ inputs.automation_policy }}
        REPORT_SUBJECT: ${{ inputs.subject }}
        REPORT_FAIL_ON: ${{ inputs.fail_on }}
        REPORT_ENABLE_SUMMARY: ${{ inputs.enable_summary }}
        REPORT_ENABLE_ANNOTATIONS: ${{ inputs.enable_annotations }}
        REPORT_FOOTER: ${{ inputs.footer }}
        REPORT_HTML_PATH: ${{ inputs.html_path }}
        REPORT_ENABLE_HTML: ${{ inputs.enable_html }}
        REPORT_ENABLE_PDF: ${{ inputs.enable_pdf }}
        REPORT_PDF_PATH: ${{ inputs.pdf_path }}
        REPORT_ENABLE_JSON: ${{ inputs.enable_json }}
        REPORT_JSON_PATH: ${{ inputs.json_path }}
        REPORT_ENABLE_AUTOMATION_POLICY: ${{ inputs.enable_automation_policy }}
        REPORT_BRAND_NAME: ${{ inputs.brand_name }}
        REPORT_BRAND_URL: ${{ inputs.brand_url }}
        REPORT_LICENSE_NOTICE: ${{ inputs.license_notice }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import datetime as dt
        import html
        import json
        import os
        import shutil
        import subprocess
        import sys
        from pathlib import Path

        LABELS = {
          "pass": "✅ Pass",
          "warn": "⚠️ Warning",
          "fail": "🔴 High",
          "skip": "⚪ Not Assessed",
          "not_applicable": "➖ Not Applicable",
          "disabled": "➖ Disabled",
        }
        MEANINGS = {
            "pass": "Control satisfied.",
            "warn": "Advisory drift; review recommended.",
            "fail": "Required control failed and must be corrected.",
            "skip": "Not evaluated on this run; coverage cannot be inferred.",
            "not_applicable": "The repository or event does not provide the inputs required by this control.",
            "disabled": "Explicitly disabled by repository or organization policy.",
        }
        UNSET = {"", "(none)", "(unset)", "n/a", "not configured"}

        def fail(message):
            print(f"::error title=Job report::{message}", file=sys.stderr)
            raise SystemExit(1)

        def load(name, raw, expected, default):
            if not (raw or "").strip():
                return default
            try:
                value = json.loads(raw)
            except json.JSONDecodeError as exc:
                fail(f"{name} must be valid JSON: {exc.msg}.")
            if not isinstance(value, expected):
                fail(f"{name} must be a JSON {expected.__name__}.")
            return value

        title = (os.environ.get("REPORT_TITLE") or "").strip()
        if not title:
            fail("title is required.")
        findings = load("findings", os.environ.get("REPORT_FINDINGS"), list, [])
        groups = load("groups", os.environ.get("REPORT_GROUPS"), dict, {})
        context = load("context_rows", os.environ.get("REPORT_CONTEXT_ROWS"), list, [])
        automation_policy = load(
          "automation_policy", os.environ.get("REPORT_AUTOMATION_POLICY"), dict,
          {"recommendation_action": "notify", "release_action": "notify", "promotion_action": "notify", "scorecard_action": "notify", "allow_auto_merge": False},
        )
        allowed_actions = {"notify", "draft_pr", "pr", "auto_merge"}
        for key in ("recommendation_action", "release_action", "promotion_action", "scorecard_action"):
          if automation_policy.get(key, "notify") not in allowed_actions:
            fail(f"automation_policy.{key} must be one of {sorted(allowed_actions)}.")
        if automation_policy.get("allow_auto_merge", False) is not True:
          automation_policy["allow_auto_merge"] = False
        fail_on = (os.environ.get("REPORT_FAIL_ON") or "fail").lower()
        if fail_on not in {"fail", "warn", "never"}:
            fail("fail_on must be fail, warn, or never.")
        want_summary = (os.environ.get("REPORT_ENABLE_SUMMARY") or "true").lower() == "true"
        want_annotations = (os.environ.get("REPORT_ENABLE_ANNOTATIONS") or "true").lower() == "true"
        want_html = (os.environ.get("REPORT_ENABLE_HTML") or "true").lower() == "true"
        want_pdf = (os.environ.get("REPORT_ENABLE_PDF") or "false").lower() == "true"
        want_json = (os.environ.get("REPORT_ENABLE_JSON") or "false").lower() == "true"
        want_policy_section = (os.environ.get("REPORT_ENABLE_AUTOMATION_POLICY") or "true").lower() == "true"
        html_path = os.environ.get("REPORT_HTML_PATH") or "blackout-secure-report.html"
        pdf_path = os.environ.get("REPORT_PDF_PATH") or "blackout-secure-report.pdf"
        json_path = os.environ.get("REPORT_JSON_PATH") or "blackout-secure-report.json"
        brand_name = (os.environ.get("REPORT_BRAND_NAME") or "Blackout Secure").strip()
        brand_url = (os.environ.get("REPORT_BRAND_URL") or "https://blackoutsecure.app").strip()
        license_notice = (os.environ.get("REPORT_LICENSE_NOTICE") or "Apache License 2.0").strip()

        def set_value(value):
            return value is not None and str(value).strip().lower() not in UNSET

        def cell(value):
            return " ".join(str(value if value is not None else "").split()).replace("|", "\\|") or "—"

        def esc(value):
            return html.escape(str(value if value is not None else ""), quote=True)

        normalized = []
        for index, item in enumerate(findings):
            if not isinstance(item, dict):
                fail(f"findings[{index}] must be an object.")
            severity = str(item.get("severity") or "").lower()
            if severity not in LABELS:
              fail(f"findings[{index}].severity must be pass, warn, fail, skip, not_applicable, or disabled.")
            normalized.append({
                "id": str(item.get("id") or f"BR{index + 1:03d}"),
                "severity": severity,
                "control": str(item.get("control") or "—"),
                "evidence": str(item.get("evidence") or "—"),
                "remediation": str(item.get("remediation") or "—"),
                "group": str(item.get("group") or ""),
            })
        counts = {key: sum(item["severity"] == key for item in normalized) for key in LABELS}
        if counts["fail"]:
            outcome, verdict, detail = "failure", "Action required", "One or more required controls failed."
        elif counts["warn"]:
            outcome, verdict, detail = "warn", "Advisory review recommended", "No blocking failures were detected, but review is recommended."
        elif counts["skip"]:
            outcome, verdict, detail = "warn", "Coverage incomplete", "No failing controls were detected, but some checks were not assessed."
        else:
            outcome, verdict, detail = "success", "Controls passed", "No failing or warning-level findings were detected."

        actions = []
        if counts["fail"]:
            actions.append("Correct the High findings before merging or releasing.")
        if counts["warn"]:
            actions.append("Review the Warning findings during the next maintenance pass.")
        if counts["skip"]:
            actions.append("Supply required credentials or enable skipped gates to obtain full coverage.")
        if not any(counts[key] for key in ("fail", "warn", "skip")):
            actions.append("Maintain the current configuration; no changes are needed.")
        if any(counts[key] for key in ("fail", "warn", "skip")):
            actions.append("Re-run after remediation or configuration changes.")

        ordered = []
        for key, meta in groups.items():
            if not isinstance(meta, dict):
                fail(f"groups.{key} must be an object.")
            ordered.append((key, str(meta.get("title") or key), str(meta.get("blurb") or "")))
        declared = {key for key, _, _ in ordered}
        if any(item["group"] not in declared for item in normalized):
            ordered.append(("", "Other findings" if declared else "Findings", ""))

        context_rows = [row for row in context if isinstance(row, dict) and row.get("include") is not False and set_value(row.get("value"))]
        total_parts = [f"{counts[key]} {LABELS[key].lower()}" for key in LABELS if counts[key]]
        attention_tiers = ("fail", "warn", "skip")
        excluded_tiers = ("not_applicable", "disabled")
        markdown = [f"# {title}", "", f"**Provided by [{brand_name}]({brand_url})**", "", "## Executive summary", "", f"**Verdict:** {verdict}", "", detail, "", f"**Totals:** {' · '.join(total_parts) or 'no findings'}", ""]
        if any(counts[key] for key in attention_tiers):
          markdown += ["### Requires attention", "", "| Status | Count | Meaning |", "| ------ | ----- | ------- |"]
          markdown.extend(
            f"| {LABELS[key]} | {counts[key]} | {MEANINGS[key]} |"
            for key in attention_tiers if counts[key]
          )
          markdown.append("")
        if counts["pass"]:
          markdown += ["### Controls satisfied", "", "| Status | Count | Meaning |", "| ------ | ----- | ------- |", f"| {LABELS['pass']} | {counts['pass']} | {MEANINGS['pass']} |", ""]
        if any(counts[key] for key in excluded_tiers):
          markdown += ["### Out of scope", "", "| Status | Count | Meaning |", "| ------ | ----- | ------- |"]
          markdown.extend(
            f"| {LABELS[key]} | {counts[key]} | {MEANINGS[key]} |"
            for key in excluded_tiers if counts[key]
          )
          markdown.append("")
        if context_rows:
            markdown += ["## Configuration used", "", "| Setting | Value | What it means |", "| ------- | ----- | ------------- |"]
            markdown += [f"| {cell(row.get('label'))} | `{cell(row.get('value'))}` | {cell(row.get('meaning'))} |" for row in context_rows]
            markdown.append("")
        if want_policy_section:
          markdown += [
            "## Automation policy",
            "",
            "| Area | Action | Meaning |",
            "| ---- | ------ | ------- |",
            f"| Recommendations | `{cell(automation_policy.get('recommendation_action', 'notify'))}` | AI recommendations remain advisory unless an explicit PR mode is configured. |",
            f"| Releases | `{cell(automation_policy.get('release_action', 'notify'))}` | Release actions require their configured approval workflow. |",
            f"| Promotion | `{cell(automation_policy.get('promotion_action', 'notify'))}` | Branch promotion is not automatic from this report. |",
            f"| Scorecard | `{cell(automation_policy.get('scorecard_action', 'notify'))}` | Scorecard findings are advisory unless a validated remediation PR exists. |",
            f"| Auto-merge | `{str(automation_policy.get('allow_auto_merge', False)).lower()}` | Auto-merge is disabled unless explicitly enabled by a protected workflow. |",
            "",
          ]
        markdown += ["## Recommended Actions", ""] + [f"- {action}" for action in actions] + ["", "## Detailed Findings", ""]
        for key, group_title, blurb in ordered:
            rows = [item for item in normalized if item["group"] == key] if key else [item for item in normalized if item["group"] not in declared]
            if not rows:
                continue
            markdown += [f"### {group_title}"] + ([f"_{blurb}_", ""] if blurb else []) + ["| Rule | Severity | Control | Evidence | Recommended remediation |", "| ---- | -------- | ------- | -------- | ----------------------- |"]
            markdown += [f"| `{cell(item['id'])}` | {LABELS[item['severity']]} | {cell(item['control'])} | {cell(item['evidence'])} | {cell(item['remediation'])} |" for item in rows] + [""]
        footer = (os.environ.get("REPORT_FOOTER") or "").strip()
        if footer:
            markdown += ["---", "", f"_{footer}_", ""]

        generated = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat()
        repo = os.environ.get("GITHUB_REPOSITORY") or "unknown/repository"
        server = (os.environ.get("GITHUB_SERVER_URL") or "https://github.com").rstrip("/")
        run_id = os.environ.get("GITHUB_RUN_ID") or ""
        sha = os.environ.get("GITHUB_SHA") or ""
        run_url = f"{server}/{repo}/actions/runs/{run_id}" if run_id else ""
        commit_url = f"{server}/{repo}/commit/{sha}" if sha else ""
        html_rows = "".join(f"<tr><th>{esc(LABELS[key])}</th><td>{counts[key]}</td><td>{esc(MEANINGS[key])}</td></tr>" for key in LABELS if counts[key])
        html_context = "" if not context_rows else "<section><h2>Configuration used</h2><table><thead><tr><th>Setting</th><th>Value</th><th>What it means</th></tr></thead><tbody>" + "".join(f"<tr><th>{esc(row.get('label'))}</th><td><code>{esc(row.get('value'))}</code></td><td>{esc(row.get('meaning'))}</td></tr>" for row in context_rows) + "</tbody></table></section>"
        html_policy = "" if not want_policy_section else "<section><h2>Automation policy</h2><table><thead><tr><th>Area</th><th>Action</th><th>Meaning</th></tr></thead><tbody>" + "".join([
          f"<tr><th>Recommendations</th><td><code>{esc(automation_policy.get('recommendation_action', 'notify'))}</code></td><td>AI recommendations remain advisory unless an explicit PR mode is configured.</td></tr>",
          f"<tr><th>Releases</th><td><code>{esc(automation_policy.get('release_action', 'notify'))}</code></td><td>Release actions require their configured approval workflow.</td></tr>",
          f"<tr><th>Promotion</th><td><code>{esc(automation_policy.get('promotion_action', 'notify'))}</code></td><td>Branch promotion is not automatic from this report.</td></tr>",
          f"<tr><th>Scorecard</th><td><code>{esc(automation_policy.get('scorecard_action', 'notify'))}</code></td><td>Scorecard findings are advisory unless a validated remediation PR exists.</td></tr>",
          f"<tr><th>Auto-merge</th><td><code>{str(automation_policy.get('allow_auto_merge', False)).lower()}</code></td><td>Auto-merge is disabled unless explicitly enabled by a protected workflow.</td></tr>",
        ]) + "</tbody></table></section>"
        html_context += html_policy
        html_findings = []
        for key, group_title, blurb in ordered:
            rows = [item for item in normalized if item["group"] == key] if key else [item for item in normalized if item["group"] not in declared]
            if not rows:
                continue
            html_findings.append(f"<h3>{esc(group_title)}</h3>" + (f"<p class='blurb'>{esc(blurb)}</p>" if blurb else "") + "<table><thead><tr><th>Rule</th><th>Severity</th><th>Control</th><th>Evidence</th><th>Recommended remediation</th></tr></thead><tbody>" + "".join(f"<tr class='severity-{item['severity']}'><td><code>{esc(item['id'])}</code></td><td>{esc(LABELS[item['severity']])}</td><td>{esc(item['control'])}</td><td>{esc(item['evidence'])}</td><td>{esc(item['remediation'])}</td></tr>" for item in rows) + "</tbody></table>")
        html_totals = " · ".join(total_parts) or "no findings"
        html_doc = f"""<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>{esc(title)} | {esc(brand_name)}</title><style>:root{{--ink:#18212b;--muted:#5c6b78;--line:#d9e1e7;--brand:#e7931d;--pass:#18864b;--warn:#a15c00;--fail:#b42318;--skip:#667085}}*{{box-sizing:border-box}}body{{margin:0;background:#f4f6f8;color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}}.page{{max-width:1180px;margin:auto;padding:32px}}header{{background:#18212b;color:#fff;padding:30px 34px;border-top:6px solid var(--brand)}}h1{{margin:5px 0;font-size:30px}}h2{{border-bottom:1px solid var(--line);padding-bottom:8px}}.eyebrow{{color:#f7b85e;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}}.meta,.blurb,.footer{{color:var(--muted)}}main{{background:#fff;padding:1px 34px 34px}}table{{width:100%;border-collapse:collapse;margin:12px 0 24px}}th,td{{border:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}}thead th{{background:#eef2f5}}code{{background:#eef2f5;padding:2px 5px}}.severity-fail td:nth-child(1),.severity-fail td:nth-child(2){{color:var(--fail);font-weight:700}}.severity-warn td:nth-child(2){{color:var(--warn);font-weight:700}}.severity-pass td:nth-child(2){{color:var(--pass);font-weight:700}}.severity-skip td:nth-child(2){{color:var(--skip);font-weight:700}}.disclaimer{{border-left:4px solid var(--brand);background:#fff8ed;padding:12px 16px;margin-top:28px}}@media print{{body{{background:#fff}}.page{{max-width:none;padding:0}}header,main{{box-shadow:none}}table,section{{break-inside:avoid}}}}@media(max-width:700px){{.page{{padding:12px}}header,main{{padding-left:16px;padding-right:16px}}table{{display:block;overflow-x:auto}}}}</style></head><body><div class='page'><header><div class='eyebrow'>{esc(brand_name)} · Audit Report</div><h1>{esc(title)}</h1><p>Generated {esc(generated)} · {esc(repo)} · Ref {esc(os.environ.get('GITHUB_REF_NAME') or os.environ.get('GITHUB_REF') or 'unknown')}</p><p><a href='{esc(server + '/' + repo)}'>GitHub repository</a> · <a href='{esc(run_url)}'>Actions run</a> · <a href='{esc(commit_url)}'>{esc(sha[:12] or 'commit unavailable')}</a></p></header><main><section><h2>Executive summary</h2><p><strong>{esc(verdict)}</strong></p><p>{esc(detail)}</p><p><strong>Totals:</strong> {esc(html_totals)}</p><table><thead><tr><th>Severity</th><th>Count</th><th>Meaning</th></tr></thead><tbody>{html_rows}</tbody></table></section>{html_context}<section><h2>Recommended actions</h2><ol>{''.join(f'<li>{esc(action)}</li>' for action in actions)}</ol></section><section><h2>Detailed findings</h2>{''.join(html_findings) or '<p>No findings were emitted.</p>'}</section><aside class='disclaimer'><strong>Open-source report notice.</strong> This report is operational guidance, not a security certification, legal opinion, warranty, or substitute for qualified human review. It reflects only the evidence available at generation time.</aside></main><footer><strong>{esc(brand_name)}</strong> · <a href='{esc(brand_url)}'>{esc(brand_url.split('://')[-1])}</a> · Copyright © 2025–{dt.datetime.now(dt.timezone.utc).year} {esc(brand_name)} · {esc(license_notice)}<br>{esc(footer)}</footer></div></body></html>"""

        html_value = ""
        pdf_value = ""
        pdf_status = "disabled"
        if want_html or want_pdf:
            Path(html_path).parent.mkdir(parents=True, exist_ok=True) if str(Path(html_path).parent) != "." else None
            Path(html_path).write_text(html_doc, encoding="utf-8")
            html_value = html_path
        if want_pdf:
            engine = next((name for name in ("chromium", "chromium-browser", "google-chrome", "google-chrome-stable") if shutil.which(name)), None)
            if engine and html_value:
                try:
                    subprocess.run([engine, "--headless", "--no-sandbox", "--disable-gpu", f"--print-to-pdf={pdf_path}", str(Path(html_path).resolve())], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
                    pdf_value, pdf_status = pdf_path, "generated"
                except (OSError, subprocess.CalledProcessError) as exc:
                    print(f"::notice title=PDF export unavailable::HTML report generated; PDF export failed: {exc}")
                    pdf_status = "unavailable"
            else:
                print("::notice title=PDF export unavailable::HTML report generated; no Chromium/Chrome binary found.")
                pdf_status = "unavailable"

        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
        if want_summary and summary_path:
            Path(summary_path).write_text("\n".join(markdown) + "\n", encoding="utf-8")
        json_value = ""
        if want_json:
            Path(json_path).parent.mkdir(parents=True, exist_ok=True) if str(Path(json_path).parent) != "." else None
            Path(json_path).write_text(json.dumps({
                "title": title,
                "subject": os.environ.get("REPORT_SUBJECT") or "",
                "outcome": outcome,
                "verdict": verdict,
                "counts": counts,
                "findings": normalized,
                "generated": generated,
                "repository": repo,
                "run_url": run_url,
                "commit_url": commit_url,
            }, indent=2) + "\n", encoding="utf-8")
            json_value = json_path
        if want_annotations:
            for item in normalized:
                if item["severity"] == "fail":
                    print(f"::error title={title}::{item['id']} {item['control']}: {item['evidence']} — {item['remediation']}")
                elif item["severity"] == "warn":
                    print(f"::warning title={title}::{item['id']} {item['control']}: {item['evidence']} — {item['remediation']}")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            for key, value in (("outcome", outcome), ("verdict", verdict), ("passes", counts["pass"]), ("warns", counts["warn"]), ("fails", counts["fail"]), ("skips", counts["skip"]), ("total", len(normalized)), ("html_path", html_value), ("pdf_path", pdf_value), ("pdf_status", pdf_status), ("json_path", json_value)):
                output.write(f"{key}={value}\n")
        if (fail_on == "fail" and counts["fail"]) or (fail_on == "warn" and (counts["fail"] or counts["warn"])):
            raise SystemExit(1)
        PY

    - name: Upload report artifact
      if: inputs.enable_artifact_upload == 'true' && (steps.report.outputs.html_path != '' || steps.report.outputs.pdf_path != '' || steps.report.outputs.json_path != '')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact_name }}
        path: |
          ${{ steps.report.outputs.html_path }}
          ${{ steps.report.outputs.pdf_path }}
          ${{ steps.report.outputs.json_path }}
        if-no-files-found: ignore
        retention-days: 30
