# Hub-local reusable workflow for the published managed-file sync action.
# The sync engine and service catalog live in bos-managed-file-sync-action.
# Named "managed file sync", not "universal", since it only ever does one
# thing; filename stays bos-universal-sync.yml to keep uses: refs stable.
name: "[RUNTIME] Blackout Secure Managed File Sync"

"on":
  workflow_call:
    inputs:
      services:
        description: Optional service override passed to the published sync action.
        required: false
        type: string
        default: ""
      mode:
        description: Optional `commit` or `check` override.
        required: false
        type: string
        default: ""
      commit_message:
        description: Optional explicit commit message override.
        required: false
        type: string
        default: "chore: sync managed files"
      runs_on:
        description: >-
          Optional runner override. Defaults to
          `organization.workflows.sync.runs_on` from the universal config.
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: >-
          Optional per-job timeout override. `0` (default) defers to
          `organization.workflows.sync.timeout_minutes`.
        required: false
        type: number
        default: 0
      hub_ref:
        description: Hub runtime ref. Use auto to follow the event target branch.
        required: false
        type: string
        default: auto
    secrets:
      workflow_sync_pat:
        description: >-
          Optional PAT with the Workflows: write permission. The default
          GITHUB_TOKEN can never push changes to .github/workflows/**
          (a hard GitHub platform restriction, not a `permissions:`
          setting). Without this secret, the two managed kicker
          workflow files are skipped; every other managed file still
          syncs normally with GITHUB_TOKEN.
        required: false
      GATEWALL_APP_PRIVATE_KEY:
        description: Private key for the reusable Gatewall automation GitHub App.
        required: false
    outputs:
      changed:
        description: "`true` when files changed or would change."
        value: ${{ jobs.sync.outputs.changed }}
      changed_files:
        description: Newline-separated changed file list.
        value: ${{ jobs.sync.outputs.changed_files }}
      commit_sha:
        description: Created commit SHA, when applicable.
        value: ${{ jobs.sync.outputs.commit_sha }}

permissions:
  contents: read

concurrency:
  group: bos-universal-sync-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-config:
    name: Resolve organization config
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      org: ${{ steps.config.outputs.organization }}
      config: ${{ steps.config.outputs.cfg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout selected hub runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackoutsecure/bos-automation-hub
          ref: ${{ inputs.hub_ref != 'auto' && inputs.hub_ref || (github.event_name == 'pull_request' && github.base_ref || github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.ref_name == 'main' && 'main' || 'dev') }}
          path: hub-runtime
          sparse-checkout: .github/actions/universal-config
          sparse-checkout-cone-mode: false
      - name: Load universal config
        id: config
        uses: ./hub-runtime/.github/actions/universal-config
        with:
          allow_missing: "true"

  sync:
    needs: resolve-config
    name: Sync managed files (${{ inputs.mode || 'commit' }})
    # Workflow input wins over the organization default so a caller can
    # still pin one run to a specific runner. Both a bare label and a
    # JSON-array label list are accepted.
    runs-on: ${{ inputs.runs_on != '' && fromJSON(startsWith(inputs.runs_on, '[') && inputs.runs_on || format('"{0}"', inputs.runs_on)) || fromJSON(needs.resolve-config.outputs.org).workflows.sync.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes || fromJSON(needs.resolve-config.outputs.org).workflows.sync.timeout_minutes }}
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      changed_files: ${{ steps.sync.outputs.changed_files }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Mint workflow synchronization token
        id: workflow-app
        if: vars.GATEWALL_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GATEWALL_APP_ID }}
          private-key: ${{ secrets.GATEWALL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Resolve workflow sync capability
        id: workflow-pat
        env:
          HAS_WORKFLOW_APP: ${{ steps.workflow-app.outputs.token != '' && 'true' || 'false' }}
          HAS_WORKFLOW_PAT: ${{ secrets.WORKFLOW_SYNC_PAT != '' && 'true' || 'false' }}
        run: |
          echo "has_token=$([[ "${HAS_WORKFLOW_APP}" = 'true' || "${HAS_WORKFLOW_PAT}" = 'true' ]] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.workflow-app.outputs.token || secrets.WORKFLOW_SYNC_PAT || github.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout canonical hub workflow templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackoutsecure/bos-automation-hub
          ref: ${{ inputs.hub_ref != 'auto' && inputs.hub_ref || (github.event_name == 'pull_request' && github.base_ref || github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.ref_name == 'main' && 'main' || 'dev') }}
          path: hub-source
          fetch-depth: 1
          persist-credentials: false

      - name: Ensure managed-file-sync global config is available
        shell: bash
        run: |
          set -euo pipefail
          config_path="hub-source/sync-files/config/managed-file-sync-global-config.json"
          if [[ ! -f "${config_path}" ]]; then
            mkdir -p "$(dirname "${config_path}")"
            git -C hub-source show "HEAD:sync-files/config/managed-file-sync-global-config.json" > "${config_path}"
          fi
          test -s "${config_path}"

      - name: Sync configured services
        id: sync
        uses: blackoutsecure/bos-managed-file-sync-action@c176d7c1def5f5b72cd3d45b8c5bd73c157187ef # v1.0.24
        with:
          # The action auto-discovers .github/bos-universal-config.json.
          use_global_config: "auto"
          global_config_path: hub-source/sync-files/config/managed-file-sync-global-config.json
          managed_files_path: hub-source/sync-files
          config_json: >-
            ${{
              steps.workflow-pat.outputs.has_token != 'true'
              && '{"managed_file_sync":{"disabled_services":["bos_universal_security_kicker","bos_universal_sync_kicker"]}}'
              || ''
            }}
          services: ${{ inputs.services }}
          dry_run: ${{ (inputs.mode || 'commit') == 'check' }}
          fail_on_drift: ${{ (inputs.mode || 'commit') == 'check' }}
          show_diff: "true"

      - name: Note workflow sync skip
        if: steps.workflow-pat.outputs.has_token != 'true'
        run: |
          echo "::notice::Managed kicker workflow files were not updated because no workflow-sync App token or legacy PAT was provided. Other managed files still synced normally."

      - name: Commit and push
        id: commit
        if: >-
          (inputs.mode || 'commit') == 'commit'
          && steps.sync.outputs.changed == 'true'
        uses: ./hub-source/.github/actions/commit-and-push
        with:
          files: ${{ steps.sync.outputs.changed_files }}
          message: "${{ inputs.commit_message || 'chore: sync managed files' }}"

      - name: Build sync findings
        id: findings
        if: ${{ always() }}
        env:
          MODE: ${{ inputs.mode || 'commit' }}
          SYNC_RESULT: ${{ steps.sync.outcome }}
          CHANGED: ${{ steps.sync.outputs.changed }}
          CHANGED_FILES: ${{ steps.sync.outputs.changed_files }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          HAS_SYNC_TOKEN: ${{ steps.workflow-pat.outputs.has_token }}
          RUNS_ON: ${{ toJSON(fromJSON(needs.resolve-config.outputs.org).workflows.sync.runs_on) }}
          REPORTING: ${{ toJSON(fromJSON(needs.resolve-config.outputs.org).reporting) }}
          CONFIG: ${{ needs.resolve-config.outputs.config }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          mode = os.environ.get("MODE") or "commit"
          sync_result = os.environ.get("SYNC_RESULT") or "skipped"
          changed = (os.environ.get("CHANGED") or "").lower() == "true"
          changed_files = [
              line.strip()
              for line in (os.environ.get("CHANGED_FILES") or "").splitlines()
              if line.strip()
          ]
          commit_sha = (os.environ.get("COMMIT_SHA") or "").strip()
          has_sync_token = (os.environ.get("HAS_SYNC_TOKEN") or "false").lower() == "true"

          findings = []
          if sync_result == "success":
              findings.append({
                  "id": "MS001", "severity": "pass", "group": "sync",
                  "control": "Managed-file reconciliation",
                  "evidence": f"engine completed in `{mode}` mode",
                  "remediation": "No action needed.",
              })
          else:
              findings.append({
                  "id": "MS001", "severity": "fail", "group": "sync",
                  "control": "Managed-file reconciliation",
                  "evidence": f"engine result: {sync_result}",
                  "remediation": (
                      "Read the managed-file-sync error above. Config errors exit 2 and "
                      "usually mean an unknown service or an unreachable config tier."
                  ),
              })

          # In `check` mode drift is the finding; in `commit` mode drift is
          # expected input and only an uncommitted change is noteworthy.
          if mode == "check":
              findings.append({
                  "id": "MS010",
                  "severity": "fail" if changed else "pass",
                  "group": "sync",
                  "control": "Managed-file drift gate",
                  "evidence": (
                      f"{len(changed_files)} file(s) out of sync" if changed
                      else "working tree matches the managed catalog"
                  ),
                  "remediation": (
                      "Re-run this workflow in `commit` mode, or apply the diff above locally."
                      if changed else "No action needed."
                  ),
              })
          else:
              findings.append({
                  "id": "MS010",
                  "severity": "pass",
                  "group": "sync",
                  "control": "Managed-file drift applied",
                  "evidence": (
                      f"{len(changed_files)} file(s) updated in commit `{commit_sha[:7]}`"
                      if commit_sha else
                      f"{len(changed_files)} file(s) changed"
                      if changed else "no drift detected"
                  ),
                  "remediation": (
                      "Applied automatically by the managed sync commit — no action needed."
                      if commit_sha or changed else
                      "No action needed — working tree already matched the managed catalog."
                  ),
              })

          findings.append({
              "id": "MS020",
              "severity": (
                "skip" if not has_sync_token else
                "pass" if sync_result == "success" else
                "warn"
              ),
              "group": "credentials",
              "control": "Workflow-file sync capability",
              "evidence": (
                "workflow-sync App token or legacy PAT available; workflow services completed successfully"
                if has_sync_token and sync_result == "success" else
                "workflow-sync credential available, but sync did not complete; workflow-file state is unverified"
                if has_sync_token else
                  "workflow-sync credential absent; managed kicker workflows were skipped"
              ),
              "remediation": (
                "—" if has_sync_token and sync_result == "success" else
                "Review and fix the sync-engine failure, then rerun in `commit` mode to verify managed workflow files."
                if has_sync_token else
                  "Configure the Gatewall GitHub App profile with `Workflows: write`. "
                  "GITHUB_TOKEN can never write to `.github/workflows/**`."
              ),
          })

          for path in changed_files[:50]:
              findings.append({
                "id": "MS030", "severity": "warn" if mode == "check" else "pass", "group": "files",
                  "control": "Managed file",
                  "evidence": f"`{path}`",
                "remediation": (
                  "Drift detected; rerun in `commit` mode to apply this file."
                  if mode == "check" else
                  "Applied by the managed sync commit."
                ),
              })

          config = json.loads(os.environ.get("CONFIG") or "{}")
          organization = config.get("organization") or {}
          workflow_config = (organization.get("workflows") or {}).get("sync") or {}
          context_rows = [
              {"label": "Sync engine", "value": "Blackout Secure Managed File Sync",
               "meaning": "Upstream package responsible for reconciliation and its native job summary."},
              {"label": "Sync engine ref", "value": "1948555b727a2e9fcaf95696e4036d8a9e0cb40e",
               "meaning": "Pinned action ref; source: https://github.com/blackoutsecure/bos-managed-file-sync-action."},
              {"label": "Mode", "value": mode,
               "meaning": "`commit` writes and pushes; `check` is a read-only drift gate."},
              {"label": "Changed files", "value": len(changed_files),
               "meaning": "Managed files the engine created, updated, or removed."},
          ]
          if workflow_config.get("runs_on") is not None:
              context_rows.append({
                  "label": "Runner", "value": json.loads(os.environ["RUNS_ON"]),
                  "meaning": "Explicitly configured by `organization.workflows.sync.runs_on`.",
              })
          if commit_sha:
              context_rows.append({
                  "label": "Commit", "value": commit_sha,
                  "meaning": "Commit created by this run, when drift was applied.",
              })

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              reporting = json.loads(os.environ.get("REPORTING") or "{}")
              handle.write(f"fail_on={reporting.get('fail_on', 'fail')}\n")
              handle.write(
                  "enable_summary="
                  f"{str(reporting.get('enable_job_summary', True)).lower()}\n"
              )
              handle.write(
                  "enable_annotations="
                  f"{str(reporting.get('enable_annotations', True)).lower()}\n"
              )
              handle.write(
                  f"title_prefix={reporting.get('title_prefix', 'Blackout Secure')}\n"
              )
              handle.write(
                  "enable_html="
                  f"{str(reporting.get('enable_html', True)).lower()}\n"
              )
              handle.write(
                  "enable_pdf="
                  f"{str(reporting.get('enable_pdf', False)).lower()}\n"
              )
              handle.write(f"html_path={reporting.get('html_path', 'blackout-secure-report.html')}\n")
              handle.write(f"pdf_path={reporting.get('pdf_path', 'blackout-secure-report.pdf')}\n")
              handle.write(f"artifact_name={reporting.get('artifact_name', 'blackout-secure-audit-report')}\n")
              for name, value in (
                  ("findings", json.dumps(findings, separators=(",", ":"))),
                  ("context_rows", json.dumps(context_rows, separators=(",", ":"))),
              ):
                  handle.write(f"{name}<<__BOS_EOF__\n{value}\n__BOS_EOF__\n")
          PY

      - name: Publish managed file sync report
        if: ${{ always() }}
        uses: ./hub-source/.github/actions/job-report
        with:
          title: ${{ steps.findings.outputs.title_prefix }} Managed File Sync Report
          subject: >-
            **Repository:** `${{ github.repository }}`  ·
            **Ref:** `${{ github.ref_name }}`  ·
            **Mode:** `${{ inputs.mode || 'commit' }}`
          findings: ${{ steps.findings.outputs.findings }}
          context_rows: ${{ steps.findings.outputs.context_rows }}
          groups: >-
            {"sync":{"title":"Reconciliation","blurb":"Engine result and drift disposition"},
             "credentials":{"title":"Credentials","blurb":"Token reach and resulting scope limits"},
             "files":{"title":"Managed files","blurb":"Per-file outcome for this run"}}
          fail_on: ${{ steps.findings.outputs.fail_on }}
          enable_summary: ${{ steps.findings.outputs.enable_summary }}
          enable_annotations: ${{ steps.findings.outputs.enable_annotations }}
          enable_html: ${{ steps.findings.outputs.enable_html }}
          enable_pdf: ${{ steps.findings.outputs.enable_pdf }}
          html_path: ${{ steps.findings.outputs.html_path }}
          pdf_path: ${{ steps.findings.outputs.pdf_path }}
          footer: >-
            This report was generated by the Blackout Secure managed file sync
            workflow (`bos-universal-sync.yml`).
      - name: Upload managed file sync audit report
        if: ${{ always() && steps.findings.outputs.enable_html == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.findings.outputs.artifact_name || 'blackout-secure-audit-report' }}
          path: |
            ${{ steps.findings.outputs.html_path || 'blackout-secure-report.html' }}
            ${{ steps.findings.outputs.pdf_path }}
          if-no-files-found: warn
          retention-days: 14
