name: Universal config
description: Universal config reader for .github/bos-universal-config.json.

inputs:
  config_path:
    description: Path to the config JSON file.
    required: false
    default: .github/bos-universal-config.json
  allow_missing:
    description: Emit {} when config file is missing instead of failing.
    required: false
    default: "false"
  require_marketplace_enabled:
    description: Fail unless `marketplace.enabled` is `true` in the parsed config.
    required: false
    default: "false"
  global_config_path:
    description: >-
      Path to an optional org-wide global config JSON file (e.g. checked
      out from bos-automation-hub's sync-files/config/). Supported policy
      sections are merged with repository config taking precedence.
    required: false
    default: ""
  use_global_config:
    description: "'auto' loads global_config_path when the file exists, 'true' requires it, 'false' ignores it."
    required: false
    default: "auto"
    summary_context:
      description: Optional service or workflow label included in the configuration summary.
      required: false
      default: ""

outputs:
  {
    cfg:
      {
        description: "Compact JSON object for downstream fromJson usage.",
        value: "${{ steps.config.outputs.cfg }}",
      },
    cloudflare:
      {
        description: "Normalized Cloudflare block derived from the config.",
        value: "${{ steps.config.outputs.cloudflare }}",
      },
    action_test:
      {
        description: "Normalized action_test block derived from the config.",
        value: "${{ steps.config.outputs.action_test }}",
      },
    release_validation:
      {
        description: "Normalized release_validation policy.",
        value: "${{ steps.config.outputs.release_validation }}",
      },
    organization:
      {
        description: "Normalized organization block (runners, reporting, per-workflow overrides).",
        value: "${{ steps.config.outputs.organization }}",
      },
    sync:
      {
        description: "Normalized managed_file_sync block.",
        value: "${{ steps.config.outputs.sync }}",
      },
  }

runs:
  using: composite
  steps:
    - name: Read, normalize, and summarize config
      id: config
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config_path }}
        ALLOW_MISSING: ${{ inputs.allow_missing }}
        REQUIRE_MARKETPLACE_ENABLED: ${{ inputs.require_marketplace_enabled }}
        GLOBAL_CONFIG_PATH: ${{ inputs.global_config_path }}
        USE_GLOBAL_CONFIG: ${{ inputs.use_global_config }}
        SUMMARY_CONTEXT: ${{ inputs.summary_context || github.workflow }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        import sys

        config_path = os.environ.get("CONFIG_PATH") or ".github/bos-universal-config.json"
        allow_missing = (os.environ.get("ALLOW_MISSING") or "false").lower() == "true"
        require_marketplace_enabled = (os.environ.get("REQUIRE_MARKETPLACE_ENABLED") or "false").lower() == "true"
        global_config_path = (os.environ.get("GLOBAL_CONFIG_PATH") or "").strip()
        use_global_config = (os.environ.get("USE_GLOBAL_CONFIG") or "auto").strip().lower()
        summary_context = (os.environ.get("SUMMARY_CONTEXT") or "").strip()
        output_path = os.environ["GITHUB_OUTPUT"]
        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

        def error(message):
            print(message, file=sys.stderr)

        if not os.path.isfile(config_path):
            if allow_missing:
                cfg = {}
            else:
                error(f"::error file={config_path}::Required config file not found.")
                sys.exit(1)
        else:
            with open(config_path, encoding="utf-8") as handle:
                raw = handle.read()
            try:
                cfg = json.loads(raw)
            except json.JSONDecodeError as exc:
                error(
                    f"::error file={config_path},line={exc.lineno},col={exc.colno}::"
                    f"Invalid JSON ({exc.msg}) at line {exc.lineno}, column {exc.colno}."
                )
                sys.exit(1)

        if not isinstance(cfg, dict):
            error(f"::error file={config_path}::Top-level config must be a JSON object.")
            sys.exit(1)

        global_cfg = {}
        if use_global_config != "false" and global_config_path:
            if os.path.isfile(global_config_path):
                with open(global_config_path, encoding="utf-8") as handle:
                    try:
                        parsed = json.loads(handle.read())
                    except json.JSONDecodeError as exc:
                        error(
                            f"::error file={global_config_path}::Invalid JSON "
                            f"({exc.msg}) at line {exc.lineno}, column {exc.colno}."
                        )
                        sys.exit(1)
                if isinstance(parsed, dict):
                    global_cfg = parsed
                else:
                    error(f"::error file={global_config_path}::Top-level global config must be a JSON object.")
                    sys.exit(1)
            elif use_global_config == "true":
                error(f"::error file={global_config_path}::Required global config file not found.")
                sys.exit(1)

        # Optional service-grouped authoring layout: consumers may nest a
        # service's settings under a named section ("launchpad", "security",
        # "sync") instead of (or alongside) the flat top-level
        # keys. Sections are hoisted to the flat keys every downstream
        # normalizer already reads, so both layouts — and any mix of the
        # two — resolve identically. A flat key already present at the top
        # level always wins over its section-nested equivalent.
        #
        # "security": { ...same fields as top-level "gate"... }
        # "sync":     { ...same fields as top-level "managed_file_sync"... }
        # "launchpad": { "upstream": {...}, "docker": {...}, ... }
        # "general":  catch-all for keys owned by neither named service
        #             (e.g. "action_test"); every key is
        #             hoisted as-is, unlike the fixed per-section allowlists
        #             above, since new standalone services land here first.
        #
        # `code_scanning` and `marketplace_kit` are intentionally preserved
        # verbatim. Their published actions own their full schemas and merge
        # the hub global policy with this repository-level config.
        WHOLE_SECTION_ALIASES = {"security": "gate", "sync": "managed_file_sync"}
        LAUNCHPAD_SUBKEYS = (
            "upstream", "stages", "docker", "scout", "balena",
            "companion_docker", "release", "platforms", "security_scan",
            "repo_metadata", "cloudflare", "triggers",
        )

        def hoist_sections(cfg):
            for section_name, flat_key in WHOLE_SECTION_ALIASES.items():
                section = cfg.get(section_name)
                if isinstance(section, dict) and flat_key not in cfg:
                    cfg[flat_key] = section
            launchpad_section = cfg.get("launchpad")
            if isinstance(launchpad_section, dict):
                for subkey in LAUNCHPAD_SUBKEYS:
                    if subkey not in cfg and subkey in launchpad_section:
                        cfg[subkey] = launchpad_section[subkey]
            general_section = cfg.get("general")
            if isinstance(general_section, dict):
                for key, value in general_section.items():
                    if key not in cfg:
                        cfg[key] = value

        hoist_sections(cfg)

        def as_dict(value):
            return value if isinstance(value, dict) else {}

        def as_list(value):
            return value if isinstance(value, list) else []

        def as_int(value, default):
            if isinstance(value, bool):
                return default
            if isinstance(value, int):
                return value
            if isinstance(value, str) and value.strip():
                try:
                    return int(value.strip())
                except ValueError:
                    return default
            return default

        def marketplace_paths(value, field):
            if value is None:
                return ""
            if not isinstance(value, list):
                error(
                    f"::error file={config_path}::marketplace.{field} must be an "
                    "array of strings."
                )
                sys.exit(1)
            paths = []
            for index, path in enumerate(value):
                if not isinstance(path, str) or not path.strip():
                    error(
                        f"::error file={config_path}::marketplace.{field}[{index}] "
                        "must be a non-empty string."
                    )
                    sys.exit(1)
                paths.append(path.strip())
            return "\n".join(paths)

        stages = as_dict(cfg.get("stages"))
        upstream = as_dict(cfg.get("upstream"))
        release = as_dict(cfg.get("release"))
        security_scan_raw = as_dict(cfg.get("security_scan"))
        cloudflare_raw = as_dict(cfg.get("cloudflare"))
        redirects = as_dict(cloudflare_raw.get("redirects"))
        headers = as_dict(cloudflare_raw.get("headers"))
        sync_raw = as_dict(cfg.get("managed_file_sync"))
        marketplace_raw = as_dict(cfg.get("marketplace"))

        marketplace = dict(marketplace_raw)
        for path_field in (
            "allowlist_paths",
            "blocked_paths",
            "required_paths",
            "extra_sync_paths",
        ):
            marketplace[path_field] = marketplace_paths(
                marketplace_raw.get(path_field), path_field
            )

        # release_label: repo config > org-wide global config > "auto".
        # "auto" is resolved by the caller (it needs github.event.repository
        # .default_branch, which this composite doesn't have access to) —
        # dev source branch -> prerelease, main -> latest, anything else ->
        # none. Explicit none/prerelease/latest always wins over branch.
        global_marketplace_raw = as_dict(global_cfg.get("marketplace"))
        global_repo_metadata = as_dict(global_marketplace_raw.get("repo_metadata"))
        repo_metadata = dict(global_repo_metadata)
        repo_metadata.update(as_dict(marketplace_raw.get("repo_metadata")))
        if repo_metadata:
            marketplace["repo_metadata"] = repo_metadata
        release_label = str(
            marketplace_raw.get("release_label")
            or global_marketplace_raw.get("release_label")
            or "auto"
        ).strip().lower()
        if release_label not in ("auto", "none", "prerelease", "latest"):
            error(
                f"::error file={config_path}::marketplace.release_label must be "
                f"one of auto, none, prerelease, latest (got '{release_label}')."
            )
            sys.exit(1)
        marketplace["release_label"] = release_label
        if "source_branch" not in marketplace and global_marketplace_raw.get("source_branch"):
            marketplace["source_branch"] = str(global_marketplace_raw["source_branch"])

        cfg["marketplace"] = marketplace

        cfg["security_scan"] = {
            "enable": security_scan_raw.get("enable") is not False,
            "fail_on": str(security_scan_raw.get("fail_on") or "fail"),
            "blocks_release": security_scan_raw.get("blocks_release") is not False,
            "enable_kit_composite": security_scan_raw.get("enable_kit_composite") is not False,
            "enable_posture": security_scan_raw.get("enable_posture") is not False,
            "enable_scanners": security_scan_raw.get("enable_scanners") is not False,
            "enable_upload": security_scan_raw.get("enable_upload") is not False,
            "codeql_languages": str(security_scan_raw.get("codeql_languages") or ""),
            "codeql_queries": str(security_scan_raw.get("codeql_queries") or "security-and-quality"),
            "codeql_runs_on": str(security_scan_raw.get("codeql_runs_on") or ""),
            "use_advanced_pat": security_scan_raw.get("use_advanced_pat") is not False,
        }

        if require_marketplace_enabled and marketplace.get("enabled") is not True:
            error(f"::error file={config_path}::marketplace.enabled must be true")
            sys.exit(1)

        cloudflare = {
            "enabled": stages.get("cloudflare_pages") is True or bool(cloudflare_raw.get("project_name")),
            "project_name": str(cloudflare_raw.get("project_name") or ""),
            "deployment_environment": str(cloudflare_raw.get("deployment_environment") or ""),
            "site_url": str(cloudflare_raw.get("site_url") or ""),
            "public_dir": str(cloudflare_raw.get("public_dir") or "."),
            "deploy_dir": str(cloudflare_raw.get("deploy_dir") or "./dist"),
            "clean_deploy_dir": cloudflare_raw.get("clean_deploy_dir") is not False,
            "copy_files": str(cloudflare_raw.get("copy_files") or ""),
            "copy_dirs": str(cloudflare_raw.get("copy_dirs") or ""),
            "prebuild_command": str(cloudflare_raw.get("prebuild_command") or ""),
            "working_directory": str(cloudflare_raw.get("working_directory") or ""),
            "branch": str(cloudflare_raw.get("branch") or ""),
            "commit_message": str(cloudflare_raw.get("commit_message") or ""),
            "wrangler_version": str(cloudflare_raw.get("wrangler_version") or ""),
            "extra_wrangler_args": str(cloudflare_raw.get("extra_wrangler_args") or ""),
            "ai_bindings": as_list(cloudflare_raw.get("ai_bindings")),
            "deploy_artifact_name": str(cloudflare_raw.get("deploy_artifact_name") or ""),
            "deploy": str(cloudflare_raw.get("deploy") or ""),
            "runs_on": str(cloudflare_raw.get("runs_on") or ""),
            "checkout_fetch_depth": as_int(cloudflare_raw.get("checkout_fetch_depth"), 0),
            "purge_cache": cloudflare_raw.get("purge_cache") is not False,
            "generate_sitemap": cloudflare_raw.get("generate_sitemap") is True,
            "generate_robots": cloudflare_raw.get("generate_robots") is True,
            "generate_security_txt": cloudflare_raw.get("generate_security_txt") is True,
            "generate_humans_txt": cloudflare_raw.get("generate_humans_txt") is True,
            "security_contact": str(cloudflare_raw.get("security_contact") or ""),
            "generator_audit": cloudflare_raw.get("generator_audit") is True,
            "generator_audit_fail_on": str(cloudflare_raw.get("generator_audit_fail_on") or "never"),
            "generator_audit_artifact_name": str(
                cloudflare_raw.get("generator_audit_artifact_name") or "site-compliance-reports"
            ),
            "generate_manifest": cloudflare_raw.get("generate_manifest") is True,
            "manifest_name": str(cloudflare_raw.get("manifest_name") or ""),
            "manifest_short_name": str(cloudflare_raw.get("manifest_short_name") or ""),
            "manifest_description": str(cloudflare_raw.get("manifest_description") or ""),
            "manifest_orientation": str(cloudflare_raw.get("manifest_orientation") or ""),
            "manifest_theme_color": str(cloudflare_raw.get("manifest_theme_color") or ""),
            "manifest_background_color": str(cloudflare_raw.get("manifest_background_color") or ""),
            "manifest_lang": str(cloudflare_raw.get("manifest_lang") or ""),
            "manifest_dir": str(cloudflare_raw.get("manifest_dir") or ""),
            "manifest_categories": str(cloudflare_raw.get("manifest_categories") or ""),
            "manifest_icons_dir": str(cloudflare_raw.get("manifest_icons_dir") or ""),
            "generate_redirects": redirects.get("generate") is True or cloudflare_raw.get("generate_redirects") is True,
            "redirects_custom_rules": str(redirects.get("custom_rules") or cloudflare_raw.get("redirects_custom_rules") or ""),
            "redirects_replace_existing": redirects.get("replace_existing") is True or cloudflare_raw.get("redirects_replace_existing") is True,
            "generate_headers": headers.get("generate") is True or cloudflare_raw.get("generate_headers") is True,
            "headers_presets": str(headers.get("presets") or cloudflare_raw.get("headers_presets") or "security,cache"),
            "headers_csp": str(headers.get("csp") or cloudflare_raw.get("headers_csp") or ""),
            "headers_hsts_max_age": str(headers.get("hsts_max_age") or cloudflare_raw.get("headers_hsts_max_age") or "63072000"),
            "headers_permissions_policy": str(
                headers.get("permissions_policy")
                or cloudflare_raw.get("headers_permissions_policy")
                or "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
            ),
            "headers_cache_html_control": str(
                headers.get("cache_html_control")
                or cloudflare_raw.get("headers_cache_html_control")
                or "public, max-age=0, must-revalidate"
            ),
            "headers_cache_assets_pattern": str(
                headers.get("cache_assets_pattern")
                or cloudflare_raw.get("headers_cache_assets_pattern")
                or "/assets/*"
            ),
            "headers_cache_assets_control": str(
                headers.get("cache_assets_control")
                or cloudflare_raw.get("headers_cache_assets_control")
                or "public, max-age=31536000, immutable"
            ),
            "generate_common_content_headers": (
                headers.get("generate_common_content_headers") is not False
                and cloudflare_raw.get("generate_common_content_headers") is not False
            ),
            "common_security_txt_cache_control": str(
                headers.get("common_security_txt_cache_control")
                or cloudflare_raw.get("common_security_txt_cache_control")
                or "public, max-age=86400"
            ),
            "common_robots_txt_cache_control": str(
                headers.get("common_robots_txt_cache_control")
                or cloudflare_raw.get("common_robots_txt_cache_control")
                or "public, max-age=86400"
            ),
            "common_sitemap_xml_cache_control": str(
                headers.get("common_sitemap_xml_cache_control")
                or cloudflare_raw.get("common_sitemap_xml_cache_control")
                or "public, max-age=86400"
            ),
            "common_humans_txt_cache_control": str(
                headers.get("common_humans_txt_cache_control")
                or cloudflare_raw.get("common_humans_txt_cache_control")
                or "public, max-age=86400"
            ),
            "headers_custom_rules": str(headers.get("custom_rules") or cloudflare_raw.get("headers_custom_rules") or ""),
            "headers_replace_existing": headers.get("replace_existing") is True or cloudflare_raw.get("headers_replace_existing") is True,
        }

        sync_services = [
            service.strip()
            for service in as_list(sync_raw.get("services"))
            if isinstance(service, str) and service.strip()
        ]
        sync = {
            "enabled": bool(sync_services),
            "services": sync_services,
            "mode": str(sync_raw.get("mode") or "commit"),
            "generate_commit_message": sync_raw.get("generate_commit_message") is not False,
            "commit_message": str(sync_raw.get("commit_message") or ""),
            "fallback_commit_message": str(
                sync_raw.get("fallback_commit_message")
                or "chore: sync managed files from bos-automation-hub"
            ),
            "git_user_name": str(sync_raw.get("git_user_name") or "github-actions[bot]"),
            "git_user_email": str(sync_raw.get("git_user_email") or "41898282+github-actions[bot]@users.noreply.github.com"),
            "push_retries": as_int(sync_raw.get("push_retries"), 3),
            "runs_on": str(sync_raw.get("runs_on") or "ubuntu-latest"),
            "timeout_minutes": as_int(sync_raw.get("timeout_minutes"), 5),
        }

        # action_test merges three tiers, first non-empty wins per field:
        # repo config > org-wide global config (global_config_path) > a
        # pyproject.toml-derived auto-detection > hardcoded fallback.
        global_action_test_raw = as_dict(global_cfg.get("action_test"))
        repo_action_test_raw = as_dict(cfg.get("action_test"))

        def merged_list(field):
            for source in (repo_action_test_raw, global_action_test_raw):
                values = [
                    str(item).strip()
                    for item in as_list(source.get(field))
                    if str(item).strip()
                ]
                if values:
                    return values
            return []

        def merged_scalar(field, default=None):
            for source in (repo_action_test_raw, global_action_test_raw):
                if field in source and source.get(field) not in (None, ""):
                    return source.get(field)
            return default

        action_test_python_versions = merged_list("python_versions")
        action_test_os_matrix = merged_list("os_matrix")
        action_test_python_packages = merged_list("python_packages")

        # Auto-detection: only consulted when neither tier configured the
        # field, so an explicit `[]` is never silently overridden.
        pyproject = {}
        pyproject_path = "pyproject.toml"
        if os.path.isfile(pyproject_path):
            with open(pyproject_path, encoding="utf-8") as handle:
                pyproject_text = handle.read()
            match = __import__("re").search(
                r'requires-python\s*=\s*"[>=~!<]*\s*(\d+)\.(\d+)', pyproject_text
            )
            if match:
                pyproject["floor"] = (int(match.group(1)), int(match.group(2)))
            pyproject["has_dev_extra"] = bool(
                __import__("re").search(r"\[project\.optional-dependencies\][^\[]*\bdev\s*=", pyproject_text, __import__("re").DOTALL)
            )

        if not action_test_python_versions:
            if pyproject.get("floor"):
                floor_major, floor_minor = pyproject["floor"]
                candidates = [(3, minor) for minor in range(9, 14)]
                action_test_python_versions = [
                    f"{major}.{minor}" for major, minor in candidates
                    if (major, minor) >= (floor_major, floor_minor)
                ]
            action_test_python_versions = action_test_python_versions or ["3.11"]

        if not action_test_python_packages:
            if os.path.isfile(pyproject_path):
                action_test_python_packages = (
                    ["-e", ".[dev]"] if pyproject.get("has_dev_extra") else ["-e", "."]
                )
            else:
                action_test_python_packages = ["pytest>=8.0", "ruff>=0.6", "PyYAML>=6.0"]

        smoke_test_config = merged_scalar("smoke_test_config")
        if smoke_test_config is None:
            smoke_test_config = {}
        if not isinstance(smoke_test_config, dict):
            error(
                f"::error file={config_path}::action_test.smoke_test_config must be an object."
            )
            sys.exit(1)

        action_test = {
            "python_versions": action_test_python_versions,
            "os_matrix": action_test_os_matrix or ["ubuntu-latest"],
            "python_packages": action_test_python_packages,
            "pytest_args": str(merged_scalar("pytest_args") or "-q"),
            "enable_smoke_test": merged_scalar("enable_smoke_test") is True,
            "smoke_trigger": str(merged_scalar("smoke_trigger") or "push-dev"),
            "smoke_test_config": smoke_test_config,
            "smoke_test_output_name": str(merged_scalar("smoke_test_output_name") or "version"),
            "timeout_pytest": as_int(merged_scalar("timeout_pytest"), 10),
            "timeout_smoke": as_int(merged_scalar("timeout_smoke"), 5),
            "enable_ai_failure_summary": merged_scalar("enable_ai_failure_summary") is not False,
            "ai_provider": str(merged_scalar("ai_provider") or "auto"),
            "ai_model": str(merged_scalar("ai_model") or "auto"),
        }

        # Release validation is centrally defaulted and repository-extensible.
        global_release_validation = as_dict(global_cfg.get("release_validation"))
        repo_release_validation = as_dict(cfg.get("release_validation"))
        merged_release_validation = dict(global_release_validation)
        merged_release_validation.update(repo_release_validation)

        def release_string_list(value, field):
            if value is None:
                return []
            if not isinstance(value, list):
                error(f"::error file={config_path}::release_validation.{field} must be an array of strings.")
                sys.exit(1)
            normalized = []
            for index, item in enumerate(value):
                if not isinstance(item, str) or not item.strip():
                    error(
                        f"::error file={config_path}::release_validation.{field}[{index}] "
                        "must be a non-empty string."
                    )
                    sys.exit(1)
                normalized.append(item.strip())
            return normalized

        validation_enforce = str(merged_release_validation.get("enforce") or "fail").lower()
        if validation_enforce not in {"fail", "warn", "never"}:
            error(
                f"::error file={config_path}::release_validation.enforce must be "
                "`fail`, `warn`, or `never`."
            )
            sys.exit(1)
        version_match = str(merged_release_validation.get("version_match") or "warn").lower()
        if version_match not in {"fail", "warn", "skip"}:
            error(
                f"::error file={config_path}::release_validation.version_match must be "
                "`fail`, `warn`, or `skip`."
            )
            sys.exit(1)

        release_validation = {
            "enabled": merged_release_validation.get("enabled") is not False,
            "enforce": validation_enforce,
            "run_node": merged_release_validation.get("run_node") is not False,
            "run_python": merged_release_validation.get("run_python") is not False,
            "run_custom": merged_release_validation.get("run_custom") is not False,
            "verify_clean_tree": merged_release_validation.get("verify_clean_tree") is not False,
            "require_lockfile": merged_release_validation.get("require_lockfile") is not False,
            "version_match": version_match,
            "required_paths": release_string_list(
                merged_release_validation.get("required_paths", ["README.md", "LICENSE"]),
                "required_paths",
            ),
            "custom_hook": str(
                merged_release_validation.get("custom_hook")
                or ".github/scripts/release-validation.sh"
            ),
            "custom_commands": release_string_list(
                merged_release_validation.get("custom_commands", []),
                "custom_commands",
            ),
        }

        # ── organization section ──────────────────────────────────
        # Org-wide runner labels, report policy, and per-workflow
        # overrides. Every hub workflow reads its `runs_on` /
        # `timeout_minutes` from here so runner topology is data, not a
        # per-workflow literal. `runs_on` resolves to a JSON string OR a
        # JSON array of labels, so callers can use the value directly in
        # `runs-on:` without a `startsWith`/`fromJSON` guard.
        ORG_WORKFLOWS = (
            "security", "sync", "launchpad", "marketplace", "action_test", "release"
        )

        organization_raw = as_dict(cfg.get("organization"))
        runners_raw = as_dict(organization_raw.get("runners"))
        reporting_raw = as_dict(organization_raw.get("reporting"))
        org_defaults_raw = as_dict(organization_raw.get("defaults"))
        org_workflows_raw = as_dict(organization_raw.get("workflows"))

        def runner_value(value, default):
            if isinstance(value, list):
                labels = [str(label).strip() for label in value if str(label).strip()]
                return labels or default
            text = str(value or "").strip()
            if not text:
                return default
            if text.startswith("["):
                try:
                    parsed = json.loads(text)
                except json.JSONDecodeError:
                    error(
                        f"::error file={config_path}::organization runner label "
                        f"{text!r} is not valid JSON."
                    )
                    sys.exit(1)
                return runner_value(parsed, default)
            return text

        default_runner = runner_value(runners_raw.get("default"), "ubuntu-latest")
        runners = {
            "default": default_runner,
            "x64": runner_value(runners_raw.get("x64"), default_runner),
            "arm64": runner_value(runners_raw.get("arm64"), default_runner),
        }

        fail_on = str(reporting_raw.get("fail_on") or "fail").strip().lower()
        if fail_on not in {"fail", "warn", "never"}:
            error(
                f"::error file={config_path}::organization.reporting.fail_on must be "
                "`fail`, `warn`, or `never`."
            )
            sys.exit(1)
        reporting = {
            "enable_job_summary": reporting_raw.get("enable_job_summary") is not False,
            "enable_annotations": reporting_raw.get("enable_annotations") is not False,
            "enable_html": reporting_raw.get("enable_html") is not False,
            "enable_pdf": reporting_raw.get("enable_pdf") is True,
            "html_path": str(reporting_raw.get("html_path") or "blackout-secure-report.html"),
            "pdf_path": str(reporting_raw.get("pdf_path") or "blackout-secure-report.pdf"),
            "artifact_name": str(reporting_raw.get("artifact_name") or "blackout-secure-audit-report"),
            "title_prefix": str(reporting_raw.get("title_prefix") or "Blackout Secure"),
            "fail_on": fail_on,
        }

        default_timeout = as_int(org_defaults_raw.get("timeout_minutes"), 30)
        org_workflows = {}
        for name in ORG_WORKFLOWS:
            override = as_dict(org_workflows_raw.get(name))
            org_workflows[name] = {
                "runs_on": runner_value(override.get("runs_on"), default_runner),
                "timeout_minutes": as_int(
                    override.get("timeout_minutes"), default_timeout
                ),
            }

        organization = {
            "runners": runners,
            "reporting": reporting,
            "defaults": {"timeout_minutes": default_timeout},
            "workflows": org_workflows,
        }

        compact_cfg = json.dumps(cfg, separators=(",", ":"))
        compact_cloudflare = json.dumps(cloudflare, separators=(",", ":"))
        compact_sync = json.dumps(sync, separators=(",", ":"))
        compact_action_test = json.dumps(action_test, separators=(",", ":"))
        compact_release_validation = json.dumps(release_validation, separators=(",", ":"))
        compact_organization = json.dumps(organization, separators=(",", ":"))

        cloudflare_enabled = stages.get("cloudflare_pages") is True or bool(cloudflare_raw.get("project_name"))
        stage_flags = {
            "docker": stages.get("docker") is True,
            "balena": stages.get("balena") is True,
            "github_release": stages.get("github_release") is True,
            "cloudflare_pages": cloudflare_enabled,
            "managed_files_sync": bool(sync_services),
        }
        enabled_stages = ", ".join([key for key, value in stage_flags.items() if value]) or "(none)"
        cf_site = (cloudflare_raw.get("site_url") or "").strip()
        cf_project = (cloudflare_raw.get("project_name") or "").strip()
        cf_env = (cloudflare_raw.get("deployment_environment") or "").strip()
        sync_mode = (sync_raw.get("mode") or "commit") if isinstance(sync_raw.get("mode"), str) else "commit"
        sync_services_text = ", ".join(sync_services)
        upstream_source = (upstream.get("source") or "").strip()
        release_template_path = (release.get("template_path") or "").strip()

        def label_text(value):
            return ", ".join(value) if isinstance(value, list) else str(value)

        audit_failures = []

        def summary_value(value, *, required=False, field=""):
            if value:
                return f"✅ `{value}`"
            if required:
                audit_failures.append(field)
                return "❌ **unset (required)**"
            return None

        summary_rows = [
            ("Enabled stages", f"✅ `{enabled_stages}`"),
            ("Upstream source", summary_value(
                upstream_source,
                required=stage_flags["docker"] or stage_flags["balena"],
                field="upstream.source",
            ) if stage_flags["docker"] or stage_flags["balena"] else None),
            ("Cloudflare project", summary_value(
                cf_project,
                required=True,
                field="cloudflare.project_name",
            ) if stage_flags["cloudflare_pages"] else None),
            ("Cloudflare environment", summary_value(cf_env) if stage_flags["cloudflare_pages"] else None),
            ("Cloudflare site URL", summary_value(cf_site) if stage_flags["cloudflare_pages"] else None),
            ("Sync mode", f"✅ `{sync_mode}`" if stage_flags["managed_files_sync"] else None),
            ("Sync services", summary_value(sync_services_text) if stage_flags["managed_files_sync"] else None),
            ("Release template path", summary_value(release_template_path) if stage_flags["github_release"] else None),
            ("Default runner", f"✅ `{label_text(runners['default'])}`"),
            ("Runner (x64 / arm64)", f"✅ `{label_text(runners['x64'])}` / `{label_text(runners['arm64'])}`"),
            ("Default job timeout", f"✅ `{default_timeout}` min"),
            ("Report policy", f"✅ `fail_on={reporting['fail_on']}`, "
             f"summary={str(reporting['enable_job_summary']).lower()}, "
             f"annotations={str(reporting['enable_annotations']).lower()}"),
        ]
        summary_lines = [
            "## Universal config snapshot" + (f" - {summary_context}" if summary_context else ""),
            "",
            "| Field | Value |",
            "| --- | --- |",
        ]
        summary_lines.extend(
            f"| {field} | {value} |"
            for field, value in summary_rows
            if value is not None
        )

        if summary_path:
            with open(summary_path, "a", encoding="utf-8") as handle:
                handle.write("\n".join(summary_lines) + "\n")

        if audit_failures:
            for field in audit_failures:
                error(f"::error file={config_path}::Required applicable configuration is unset: {field}.")
            sys.exit(1)

        print("Universal config snapshot" + (f" ({summary_context})" if summary_context else "") + ":")
        print(f"  enabled_stages: {enabled_stages}")
        if stage_flags["docker"] or stage_flags["balena"]:
            print(f"  upstream_source: {upstream_source or '(unset)'}")
        if stage_flags["cloudflare_pages"]:
            print(f"  cloudflare_project: {cf_project or '(unset)'}")
            print(f"  cloudflare_environment: {cf_env or '(unset)'}")
            print(f"  cloudflare_site_url: {cf_site or '(unset)'}")
        if stage_flags["managed_files_sync"]:
            print(f"  sync_mode: {sync_mode}")
            print(f"  sync_services: {sync_services_text}")
        print(f"  default_runner: {label_text(runners['default'])}")
        print(f"  default_timeout_minutes: {default_timeout}")
        print(f"  reporting_fail_on: {reporting['fail_on']}")

        with open(output_path, "a", encoding="utf-8") as handle:
            handle.write("cfg<<__BOS_EOF__\n")
            handle.write(compact_cfg + "\n")
            handle.write("__BOS_EOF__\n")
            handle.write(f"cloudflare={compact_cloudflare}\n")
            handle.write(f"sync={compact_sync}\n")
            handle.write(f"action_test={compact_action_test}\n")
            handle.write(f"release_validation={compact_release_validation}\n")
            handle.write(f"organization={compact_organization}\n")
        PY
