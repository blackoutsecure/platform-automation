# Repository About-box synchronization.
#
# Centralizes the orchestration around the hub's `repo-metadata` composite:
# token selection, released-tree checkout, write serialization, and outputs.
# Real writes require an Administration-capable PAT. Dry runs may use the
# job-scoped GITHUB_TOKEN because the composite does not call write endpoints.
name: Repository Metadata Sync

"on":
  workflow_call:
    inputs:
      checkout_ref:
        description: >-
          Git ref whose README supplies metadata source material. Empty uses
          the triggering workflow's commit.
        required: false
        type: string
        default: ""
      readme_path:
        description: "README path at `checkout_ref`. Default `README.md`."
        required: false
        type: string
        default: "README.md"
      description:
        description: "Explicit repository description. Empty derives it from the README."
        required: false
        type: string
        default: ""
      description_max_length:
        description: "Maximum repository-description length (1-350)."
        required: false
        type: number
        default: 350
      description_mode:
        description: "`auto` uses AI then README; `fallback` skips AI; `existing` leaves the description unchanged."
        required: false
        type: string
        default: auto
      description_fallback:
        description: "Deterministic description used by fallback mode."
        required: false
        type: string
        default: ""
      homepage:
        description: "Explicit homepage URL. Empty preserves it; `__unset__` clears it."
        required: false
        type: string
        default: ""
      topics:
        description: "Explicit space- or comma-separated topics."
        required: false
        type: string
        default: ""
      generate_topics:
        description: "Derive topics from the README when explicit topics are empty."
        required: false
        type: boolean
        default: false
      topics_fallback:
        description: "Topics used when generated topics are unavailable."
        required: false
        type: string
        default: ""
      max_topics:
        description: "Maximum number of topics; values above 20 are clamped."
        required: false
        type: number
        default: 20
      primary_category:
        description: "Marketplace primary category slug, auto, or empty to skip."
        required: false
        type: string
        default: auto
      secondary_category:
        description: "Marketplace secondary category slug, auto, or empty to skip."
        required: false
        type: string
        default: auto
      marketplace_slug:
        description: "Marketplace listing slug used for category comparison."
        required: false
        type: string
        default: ""
      ai_enabled:
        description: "Use GitHub Models for README-derived description and topics."
        required: false
        type: boolean
        default: true
      ai_model:
        description: "GitHub Models model identifier."
        required: false
        type: string
        default: auto
      show_releases:
        description: "Request the Releases repository-home widget."
        required: false
        type: boolean
        default: true
      show_deployments:
        description: "Request the Deployments repository-home widget."
        required: false
        type: boolean
        default: false
      show_packages:
        description: "Request the Packages repository-home widget."
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Resolve and summarize metadata without API writes."
        required: false
        type: boolean
        default: false
      report_annotations:
        description: "Emit actionable GitHub annotations for report warnings and errors."
        required: false
        type: boolean
        default: true
    secrets:
      REPO_ADMIN_PAT:
        description: >-
          Preferred fine-grained PAT with Administration: write and Metadata:
          read on the caller repository.
        required: false
      GATEWALL_APP_PRIVATE_KEY:
        description: Private key for the reusable Gatewall automation GitHub App.
        required: false
      RELEASE_PAT:
        description: >-
          Fallback PAT for repositories using one credential for promotion and
          metadata synchronization.
        required: false
    outputs:
      description:
        description: "Resolved description."
        value: ${{ jobs.sync.outputs.description }}
      description_source:
        description: "Description source: explicit, ai, readme, or existing."
        value: ${{ jobs.sync.outputs.description_source }}
      homepage:
        description: "Resolved homepage, or empty when unchanged."
        value: ${{ jobs.sync.outputs.homepage }}
      topics:
        description: "Resolved topics, space-separated."
        value: ${{ jobs.sync.outputs.topics }}
      topics_source:
        description: "Topics source: explicit, ai, fallback, or skipped."
        value: ${{ jobs.sync.outputs.topics_source }}
      ai_used:
        description: "`true` when GitHub Models supplied metadata."
        value: ${{ jobs.sync.outputs.ai_used }}
      applied:
        description: "`true` when the composite completed at least one API write."
        value: ${{ jobs.sync.outputs.applied }}
      primary_category:
        description: "Resolved primary Marketplace category slug."
        value: ${{ jobs.sync.outputs.primary_category }}
      secondary_category:
        description: "Resolved secondary Marketplace category slug."
        value: ${{ jobs.sync.outputs.secondary_category }}
      primary_category_confidence:
        description: "AI confidence for the primary category."
        value: ${{ jobs.sync.outputs.primary_category_confidence }}
      secondary_category_confidence:
        description: "AI confidence for the secondary category."
        value: ${{ jobs.sync.outputs.secondary_category_confidence }}
      skipped:
        description: "`true` when no write-capable token was available."
        value: ${{ jobs.sync.outputs.skipped }}
      changed:
        description: "`true` when desired metadata differed from the current snapshot."
        value: ${{ jobs.sync.outputs.changed }}
      report:
        description: "Detailed Markdown field report."
        value: ${{ jobs.sync.outputs.report }}
      report_json:
        description: "Structured JSON field report."
        value: ${{ jobs.sync.outputs.report_json }}

permissions:
  contents: read
  models: read

jobs:
  sync:
    name: Sync repository About box
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      models: read
    concurrency:
      group: repo-metadata-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      description: ${{ steps.metadata.outputs.description }}
      description_source: ${{ steps.metadata.outputs.description_source }}
      homepage: ${{ steps.metadata.outputs.homepage }}
      topics: ${{ steps.metadata.outputs.topics }}
      topics_source: ${{ steps.metadata.outputs.topics_source }}
      ai_used: ${{ steps.metadata.outputs.ai_used }}
      applied: ${{ steps.metadata.outputs.applied }}
      primary_category: ${{ steps.metadata.outputs.primary_category }}
      secondary_category: ${{ steps.metadata.outputs.secondary_category }}
      primary_category_confidence: ${{ steps.metadata.outputs.primary_category_confidence }}
      secondary_category_confidence: ${{ steps.metadata.outputs.secondary_category_confidence }}
      changed: ${{ steps.metadata.outputs.changed }}
      report: ${{ steps.metadata.outputs.report }}
      report_json: ${{ steps.metadata.outputs.report_json }}
      skipped: ${{ steps.token.outputs.available != 'true' }}
    steps:
      - name: Mint repository administration token
        id: repo-admin-app
        if: vars.GATEWALL_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GATEWALL_APP_ID }}
          private-key: ${{ secrets.GATEWALL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write

      - name: Resolve metadata token
        id: token
        env:
          HAS_APP_TOKEN: ${{ steps.repo-admin-app.outputs.token != '' && 'true' || 'false' }}
          HAS_ADMIN_PAT: ${{ secrets.REPO_ADMIN_PAT != '' && 'true' || 'false' }}
          HAS_RELEASE_PAT: ${{ secrets.RELEASE_PAT != '' && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          available='false'
          token_source='none'
          if [ "${HAS_APP_TOKEN}" = "true" ]; then
            available='true'
            token_source='GATEWALL_APP'
          elif [ "${HAS_ADMIN_PAT}" = "true" ]; then
            available='true'
            token_source='REPO_ADMIN_PAT'
          elif [ "${HAS_RELEASE_PAT}" = "true" ]; then
            available='true'
            token_source='RELEASE_PAT'
          elif [ "${DRY_RUN}" = "true" ]; then
            available='true'
            token_source='GITHUB_TOKEN'
          fi

          if [ "${available}" = "true" ]; then
            token_mode='write'
            [ "${DRY_RUN}" = "true" ] && token_mode='dry-run'
            echo "::notice title=Repository metadata sync::Using ${token_source} (${token_mode} mode)"
          else
            {
              echo "## Repository metadata sync"
              echo ""
              echo "Skipped because no repository-admin App token or legacy PAT was provided."
              echo ""
              echo "A real sync requires a token with \`Administration: write\` and \`Metadata: read\` on this repository."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::notice title=Repository metadata sync skipped::No Administration-capable token was provided"
          fi

          echo "available=${available}" >> "${GITHUB_OUTPUT}"

      - name: Checkout metadata source
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Synchronize repository metadata
        if: steps.token.outputs.available == 'true'
        id: metadata
        uses: blackoutsecure/bos-repo-about-sync-action@f7026ca11eeff654b376faa96a9a007e8d611a36 # v0.1.27
        with:
          github_token: ${{ steps.repo-admin-app.outputs.token || secrets.REPO_ADMIN_PAT || secrets.RELEASE_PAT || github.token }}
          readme_path: ${{ inputs.readme_path }}
          description: ${{ inputs.description }}
          description_max_length: ${{ inputs.description_max_length }}
          description_mode: ${{ inputs.description_mode }}
          description_fallback: ${{ inputs.description_fallback }}
          homepage: ${{ inputs.homepage }}
          topics: ${{ inputs.topics }}
          generate_topics: ${{ inputs.generate_topics }}
          topics_fallback: ${{ inputs.topics_fallback }}
          max_topics: ${{ inputs.max_topics }}
          primary_category: ${{ inputs.primary_category }}
          secondary_category: ${{ inputs.secondary_category }}
          marketplace_slug: ${{ inputs.marketplace_slug }}
          ai_enabled: ${{ inputs.ai_enabled }}
          ai_model: ${{ inputs.ai_model }}
          show_releases: ${{ inputs.show_releases }}
          show_deployments: ${{ inputs.show_deployments }}
          show_packages: ${{ inputs.show_packages }}
          dry_run: ${{ inputs.dry_run }}
          report_annotations: ${{ inputs.report_annotations }}
